<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16141c">
<title>Quiz · uge 4</title>
<style>
:root{--bg:#16141c;--card:#211e2b;--card2:#2a2636;--line:#363046;--txt:#ece9f3;--dim:#a39dba;--acc:#8b6cef;--acc2:#a78bfa;--ok:#3fb67d;--bad:#e5566b;--okbg:rgba(63,182,125,.15);--badbg:rgba(229,86,107,.15)}
@media (prefers-color-scheme:light){:root{--bg:#f6f5fa;--card:#fff;--card2:#f1eff8;--line:#e0dcee;--txt:#1d1a26;--dim:#6b6680;--acc2:#6d4fd8;--okbg:rgba(63,182,125,.13);--badbg:rgba(229,86,107,.11)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:1.45rem;margin:.2em 0 .1em}
h2{font-size:1.1rem;margin:0}
.sub{color:var(--dim);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qhead{display:flex;gap:8px;align-items:flex-start}
.qhead .row{flex:1;min-width:0}
.grow{flex:1;min-width:0}
.spread{justify-content:space-between}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:13px 18px;font-weight:600;width:100%;font-size:1rem}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 10px;border-radius:8px;background:none;font-size:.9rem;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.chip{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.chip.unread{border-color:#b7892f;color:#e0b04f}
.chip.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.texts{margin:10px 0 12px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.texts div{display:flex;gap:6px;align-items:center}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.q{font-size:1.12rem;font-weight:600;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 14px 48px;margin:10px 0;position:relative;line-height:1.35}
.opt::before{content:attr(data-k);position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:50%;background:var(--card2);color:var(--dim);font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok::before{content:"✓";background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad::before{content:"✕";background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.expl{scroll-margin-bottom:130px;background:var(--card2);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:.95rem}
.expl b{color:var(--acc2)}
.answer{white-space:pre-wrap}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.big{font-size:3rem;font-weight:800;margin:.1em 0}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss:first-child{border-top:0}
.miss .your{color:var(--bad);font-size:.9rem}
.miss .right{color:var(--ok);font-size:.9rem}
.link{background:none;color:var(--dim);text-decoration:underline;font-size:.85rem;padding:6px}
.x{background:none;color:var(--dim);font-size:1.4rem;padding:0 4px;line-height:1}
label.tog{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--dim)}
label.tog input{width:18px;height:18px;accent-color:var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<div class="foot" id="foot" hidden><div class="in" id="footin"></div></div>
<script>
const QUIZ = {"id": "2026E-uge04", "titel": "Quiz · uge 4", "undertitel": "Session 4 · 21.–25. september 2026 · DAK3, EP, PA", "semester": "2026E", "uge": 4, "kurser": [{"kode": "DAK3", "navn": "Kolonisering og Mellemøsten", "tekster": [{"id": "hariri", "label": "Hariri 2015", "kort": "Hariri 2015 - Muslim and Middle Eastern Exceptionalism", "læst": true}, {"id": "herb", "label": "Herb 1999", "kort": "Herb 1999 - All in the Family", "læst": true}, {"id": "lange", "label": "Lange 2009 (slides + anmeldelse)", "kort": "Lange 2009 - Lineages of Despotism and Development", "læst": false}, {"id": "slides", "label": "Forelæsning F04"}], "spørgsmål": [{"type": "mc", "kilde": "hariri", "side": "s. 478, 486", "tekst": "Hvad er Hariris hovedkonklusion om ‘Middle Eastern exceptionalism’?", "muligheder": ["Kontrolleret for førkolonial statsudvikling og bosættelse forsvinder underskuddet", "Underskuddet forsvinder, når man kontrollerer for olieafhængighed og ressourceforbandelsen", "Underskuddet skyldes primært de mellemøstlige staters usædvanligt store repressive kapacitet", "Underskuddet er reelt exceptionelt og kan kun forklares med doktrinære træk ved islam"], "rigtig": 0, "forklaring": "MENA-dummyen falder fra −0,17 til 0,00 (democracy stock), når førkolonial statshistorie (instrumenteret) kommer med. Hariri afviser ikke, at fx islam eller repressiv kapacitet har spillet en rolle. Hans pointe er, at de ikke har været en større hindring end i lande med sammenlignelig politisk og kolonial historie.", "id": "DAK3-01"}, {"type": "mc", "kilde": "hariri", "side": "s. 482–484", "tekst": "I Tabel 1 kontrollerer Hariri for repressiv kapacitet, modernisering, olie, grænsekunstighed og fraktionalisering. Hvad sker der med Mellemøst-dummyen?", "muligheder": ["Den forbliver stor og signifikant negativ", "Den bliver insignifikant, så snart der kontrolleres for olieeksport", "Den skifter fortegn, når der kontrolleres for BNP per indbygger", "Den halveres af kontrollen for militærudgifter og bliver insignifikant"], "rigtig": 0, "forklaring": "Selv med alle kontroller er democracy stock 17 % lavere og sandsynligheden for demokrati 39 % lavere. Kontrol for modernisering gør faktisk underskuddet større (−0,28/−0,30). Det er baggrunden for Hariris pointe om, at historie er en ‘omitted variable’.", "id": "DAK3-02"}, {"type": "mc", "kilde": "hariri", "side": "s. 479–480", "tekst": "Hvordan hænger førkolonial statsudvikling sammen med koloniseringen i trin 1 af Hariris argument?", "muligheder": ["Udviklede stater var sværere at kolonisere og blev oftere styret indirekte", "Udviklede stater blev koloniseret først, fordi de havde værdifulde handelsruter og skatteindtægter", "Udviklede stater blev styret direkte, fordi kolonimagten kunne overtage deres bureaukrati", "Statsudvikling havde ingen selvstændig effekt; sygdomsmiljøet afgjorde koloniseringsmønstret"], "rigtig": 0, "forklaring": "Hypoteserne A1 og B1. Trin 2 er, at manglende bosættelse (A2) og indirekte styre (B2) gjorde det mere sandsynligt at forblive autokratisk. Sygdom, teknologi og ressourcer nævnes som andre faktorer, men statsudvikling var en selvstændig faktor.", "id": "DAK3-03"}, {"type": "mc", "kilde": "hariri", "side": "s. 484–485", "tekst": "Hvilket instrument bruger Hariri for førkolonial statsudvikling i sine 2SLS-modeller?", "muligheder": ["Tidspunktet for den neolitiske revolution", "Dødeligheden blandt tidlige europæiske bosættere", "Afstanden fra landet til de europæiske kolonimagter", "Befolkningstætheden i år 1500"], "rigtig": 0, "forklaring": "Statshistorie og islam er flettet sammen, fordi islam spredtes med Umayyad-kalifatets erobringer. Samtidig kan regimetypen påvirke statens overlevelse. Den neolitiske revolution fandt sted årtusinder før Muhammed og er upåvirket af tidligt moderne regimer. Befolkningstæthed i 1500 bruges kun til at imputere manglende værdier.", "id": "DAK3-04"}, {"type": "mc", "kilde": "hariri", "side": "s. 481", "tekst": "Hvordan måler Hariri europæisk bosættelse?", "muligheder": ["Andelen, der har et europæisk kolonisprog som modersmål", "Andelen af befolkningen med europæisk afstamning", "Antallet af koloniale embedsmænd per indbygger omkring år 1900", "Antallet af år landet var under europæisk kolonistyre"], "rigtig": 0, "forklaring": "Førstesproget skal være engelsk, fransk, tysk, portugisisk eller spansk. Afstamning fravælges, fordi det kræver en vilkårlig tærskel for, hvornår mestizer tæller som europæere.", "id": "DAK3-05"}, {"type": "mc", "kilde": "hariri", "side": "s. 481", "tekst": "Hvilken proxy for indirekte styre låner Hariri fra Lange?", "muligheder": ["Andelen af retssager ved anerkendte sædvaneretlige (customary) domstole", "Andelen af lokale høvdinge, der modtog løn direkte fra kolonimagten", "Antallet af britiske administratorer per 10.000 indbyggere i kolonien", "Om kolonien havde en lovgivende forsamling før uafhængigheden"], "rigtig": 0, "forklaring": "Under direkte styre indførte kolonimagten et ensartet retssystem baseret på metropolens love. Under indirekte styre blev de oprindelige retsstrukturer indarbejdet. Målet findes kun for 33 britiske kolonier (resten imputeres). Go nævner samme indikator i sin anmeldelse af Lange.", "id": "DAK3-06"}, {"type": "mc", "kilde": "hariri", "side": "s. 480", "tekst": "Hvorfor spredte den ‘defensive modernisering’ (fx Tanzimat) ikke demokratiske institutioner i Mellemøsten ifølge Hariri?", "muligheder": ["De var top-down og selektive og nåede kun en snæver elite", "De blev påtvunget af kolonimagterne mod befolkningens vilje og derfor afvist", "De kopierede kun Europas økonomiske institutioner, ikke dets militær og bureaukrati", "De var så radikale, at de straks udløste borgerkrig og statssammenbrud"], "rigtig": 0, "forklaring": "‘The most important aim of the Tanzimat was autocracy and centralization’ (Shaw). De nye institutioner blev lagt oven på de traditionelle, som bestod, og idéerne var begrænset til ‘the French knowers’. I bosætterkolonierne gennemsyrede idéerne derimod hele samfundet.", "id": "DAK3-07"}, {"type": "mc", "kilde": "hariri", "side": "s. 487–488", "tekst": "Tyrkiet ligger langt over regressionslinjen og er mere demokratisk end forventet. Hvordan forklarer Hariri det?", "muligheder": ["Atatürk nedlagde de traditionelle institutioner frem for at supplere dem", "Tyrkiet fik omfattende europæisk bosættelse efter Første Verdenskrig", "Tyrkiet blev styret direkte af Storbritannien i hele mandatperioden", "Tyrkiet havde en usædvanligt lav score på State Antiquity Index før 1500"], "rigtig": 0, "forklaring": "Sultanatet blev erstattet af en republik med mandlig valgret, og traditionelle domstole, administration og religiøse skoler blev nedlagt. Tyrkiet fik europæisk indflydelse ‘by example’ frem for gennem bosættelse. Det viser, at bosættelse ikke er en nødvendig betingelse.", "id": "DAK3-08"}, {"type": "mc", "kilde": "hariri", "side": "s. 488 (fn. 21)", "tekst": "Hvilket land viser ifølge Hariri, at europæisk bosættelse ikke er en tilstrækkelig betingelse for demokrati?", "muligheder": ["Algeriet", "Tyrkiet", "Libanon", "Irak"], "rigtig": 0, "forklaring": "Algeriet var formelt et fransk departement. De politiske rettigheder var forbeholdt bosætterne, den lovgivende forsamling lå i Paris, og bosætterne forlod landet i stort tal ved uafhængigheden. Befrielseskrigen gav desuden hæren stor legitimitet. Tyrkiet er det modsatte eksempel: bosættelse er heller ikke nødvendig.", "id": "DAK3-09"}, {"type": "mc", "kilde": "herb", "side": "s. 8–9", "tekst": "Hvad kendetegner et ‘dynastisk monarki’ hos Herb?", "muligheder": ["Familien monopoliserer ministerierne for inden-, uden- og forsvarsanliggender", "Monarken regerer alene og vælger frit sine ministre blandt loyale officerer", "Tronen går altid til den ældste søn efter en fast, forfatningsbestemt arvefølge", "Monarken deler magten med et folkevalgt parlament, der udpeger regeringen"], "rigtig": 0, "forklaring": "De såkaldte ‘ministries of sovereignty’ (wizarat al-siyada), fx i Saudi-Arabien, Kuwait, Qatar, Bahrain og UAE. Den anden type, hvor kongen selv vælger sine løjtnanter (som shahen), giver mere personlig magt men mindre stabilitet. Montesquieu: jo mere grænseløs monarkens magt, jo mindre sikker er han.", "id": "DAK3-10"}, {"type": "mc", "kilde": "herb", "side": "s. 2–3", "tekst": "Hvorfor faldt det libyske monarki i 1969 ifølge Herb?", "muligheder": ["Idris havde holdt familien ude af magten, så ingen forsvarede tronen", "Oliebommen skabte en uddannet middelklasse, der krævede en republik", "Beduinstammerne, som hæren blev rekrutteret fra, vendte sig mod kongen", "Vestligt pres tvang kongen til at åbne et parlament, der siden væltede ham"], "rigtig": 0, "forklaring": "Idris havde ingen sønner og øste gunst over familien til sin yndlingshofmand. Den familie ville miste magten ved kronprinsens tiltræden og havde ingen grund til at forsvare monarkiet. Kuwait er kontrasten: I 1938 besatte Al Sabah alle statens poster.", "id": "DAK3-11"}, {"type": "mc", "kilde": "herb", "side": "s. 9–10", "tekst": "Hvilken mekanisme holder ifølge Herb de dynastiske familier sammen ved tronskifter?", "muligheder": ["Arvefølgen afgøres ved familiekonsensus, og resten af familien bandwagoner", "En uafhængig forfatningsdomstol afgør arvefølgen, og alle familiegrene respekterer den", "Kongen udpeger sin efterfølger alene, og familien har ingen formel indflydelse", "Familien holdes sammen af gensidig hengivenhed og fravær af konkurrence om poster"], "rigtig": 0, "forklaring": "Slægtninge på nøgleposter kræver deres poster bekræftet til gengæld for at støtte en ny hersker, og bandwagoning forhindrer, at familien splittes på midten. Paradoksalt nok er det konkurrencen om magten blandt prinserne, der skabte og fastholder dynastiets greb om staten.", "id": "DAK3-12"}, {"type": "mc", "kilde": "herb", "side": "s. 10–11", "tekst": "Hvordan forholder Herb sig til rentierstatsteorien (olie → stabile autokratier)?", "muligheder": ["Olie virkede kun, fordi den lod de eksisterende familier erobre den voksende stat", "Han bekræfter den: alle overlevende monarkier er olierige, og alle faldne var fattige", "Han afviser den og mener, at olie har gjort monarkierne markant mindre stabile", "Olie virker kun, fordi den finansierer hære rekrutteret blandt loyale beduiner"], "rigtig": 0, "forklaring": "Iran, Irak og Libyen var rentierstater og faldt alligevel, mens fattige Jordan og Marokko overlevede (Tabel 1.2). Rentierteorien siger, at rentierstater bliver autoritære, men ikke hvordan. Det er Herbs ‘lille nyfortolkning’ af ressourceforbandelsen, som diskussionsarket spørger til.", "id": "DAK3-13"}, {"type": "mc", "kilde": "herb", "side": "s. 11–13", "tekst": "Hvad viser Herbs data om uddannelse (indskrivning på videregående uddannelser)?", "muligheder": ["De overlevende monarkier har flere studerende end de faldne havde ved deres fald", "De faldne monarkier havde markant flere studerende – som Huntington forudsagde", "Golfmonarkierne har næsten ingen studerende, fordi monarkerne begrænser uddannelse", "Uddannelse øger stabiliteten i oliemonarkier, men mindsker den i fattige monarkier"], "rigtig": 0, "forklaring": "Halpern og Huntington forventede, at den nye uddannede middelklasse ville fælde monarkerne. Det ses ikke i data, hverken i Jordan og Marokko eller i Golfen. Når hverken olie eller uddannelse forklarer mønstret, har Herb sin centrale gåde.", "id": "DAK3-14"}, {"type": "mc", "kilde": "herb", "side": "s. 15–16", "tekst": "Hvorfor har monarkier ifølge Herb bedre forudsætninger end andre autokratier for gradvis liberalisering?", "muligheder": ["En monark kan holde valg og stadig være monark", "Monarker har større oliereserver og kan derfor købe oppositionen fri", "Monarkier har ingen stærk hær, så oppositionen frygter ikke kup", "Monarkers magt var allerede begrænset af parlamenter fra kolonitiden"], "rigtig": 0, "forklaring": "For andre autokrater betyder et tabt valg tabt legitimitet. Monarken skal kun undgå et flertal af ‘fire-breathing antiroyalists’. Magten kan derefter forhandles i små, forudsigelige skridt mellem palads og parlament, som i Europas konstitutionelle monarkier. Dermed kan monarken undslippe Huntingtons ‘King's dilemma’.", "id": "DAK3-15"}, {"type": "mc", "kilde": "herb", "side": "s. 8", "tekst": "Hvor placerer Herb Jordan, Marokko og Oman i sin Tabel 1.1?", "muligheder": ["Familien må sidde i regeringen, men monopoliserer ikke posterne", "Dynastiske monarkier, hvor familien besætter alle nøgleministerier", "Monarkier, hvor forfatningen forbyder familien at sidde i regeringen", "Monarkier, der faldt til revolutioner efter Anden Verdenskrig"], "rigtig": 0, "forklaring": "Ingen af de dynastiske monarkier (Bahrain, Kuwait, Qatar, Saudi-Arabien, UAE) har haft en revolution. Alle monarkier, der udelukkede familien fra regeringen (Afghanistan, Egypten, Iran, Irak, Libyen), er faldet. Jordan, Marokko og Oman er mellemgruppen.", "id": "DAK3-16"}, {"type": "mc", "kilde": "lange", "side": "slides s. 8–9", "tekst": "Hvilken definition hører til indirekte styre hos Lange?", "muligheder": ["‘Domination via collaborative relations between a colonial center and regionally based indigenous institutions’", "‘A complete system of colonial domination in which local and central institutions are well integrated’", "‘A formalized chain of command linking every provincial administration uniformly to the central state’", "‘Rule through salaried bureaucrats applying one uniform metropolitan legal code across the whole territory’"], "rigtig": 0, "forklaring": "De tre andre citater beskriver direkte styre: en territoriel udvidelse af staten med formelt bureaukrati og en ensartet kommandovej. Bemærk, at Lange-kapitlet ikke ligger i Kilder, så spørgsmålet bygger på slides.", "id": "DAK3-17"}, {"type": "mc", "kilde": "slides", "side": "s. 10–11", "tekst": "Hvornår bliver en koloni ifølge Gerring et al. (fremlagt til forelæsningen) mest sandsynligt styret indirekte?", "muligheder": ["Når der findes en hierarkisk, statslignende struktur at delegere til", "Når mange bosættere fra metropolen udvandrer og slår sig ned i kolonien", "Når befolkningen er organiseret i egalitære stammer uden centrale ledere", "Når kolonien ligger tæt på metropolen og er let at kontrollere militært"], "rigtig": 0, "forklaring": "Uden en stabil myndighedsstruktur må kolonimagten selv projicere autoritet med eget politi, militær og bureaukrati. Det kræver bosættere, som forventer de samme institutioner som hjemme, og resultatet er direkte styre. Samme logik ligger bag Hariris trin 1.", "id": "DAK3-18"}, {"type": "mc", "kilde": "slides", "side": "s. 13–15", "tekst": "Hvad dækker Mamdanis begreb ‘decentraliseret despoti’?", "muligheder": ["Høvdinge blev kun ansvarlige opad over for kolonimagten og regerede som despoter", "Magten blev spredt på mange konkurrerende høvdinge, hvilket skabte lokalt demokrati", "De uafhængige stater decentraliserede magten og mistede kontrollen med periferien", "Direkte styre skabte et stærkt, men undertrykkende centralbureaukrati i hovedstaden"], "rigtig": 0, "forklaring": "Lesotho-eksemplet (Ashton 1947): Med britisk beskyttelse behøvede høvdingene ikke længere frygte angreb udefra eller indefra. De holdt op med at konsultere folket, og folkeforsamlingen (pitso) døde ud. Indirekte styre er desuden konserverende og skaber en todelt stat.", "id": "DAK3-19"}, {"type": "mc", "kilde": "lange", "side": "anmeldelse s. 1941–42", "tekst": "Hvilken kritik rejser Julian Go i sin anmeldelse af Langes bog?", "muligheder": ["Case-udvælgelsen, og at Sierra Leones diamanter kan være en alternativ forklaring", "At Lange kun ser på økonomisk udvikling og helt overser demokratisering", "At Lange mangler kvalitative casestudier og udelukkende bruger regressioner", "At Lange sammenligner britiske og franske kolonier uden at kontrollere for kolonimagt"], "rigtig": 0, "forklaring": "Omkring 28 kolonier udelukkes med henvisning til homogenitet. Men hvis kolonistyrets form er afgørende uanset andre faktorer, burde forskelle mellem landene ikke betyde noget. Go roser samtidig, at Lange ser på både økonomisk og politisk udvikling og kombinerer regression med cases (Mauritius, Sierra Leone, Botswana og Guyana).", "id": "DAK3-20"}, {"type": "mc", "kilde": "slides", "side": "s. 27–29", "tekst": "Sykes-Picot-grænserne tvang i nogle tilfælde forskellige grupper til at leve i samme politiske enhed. Hvad kaldes det hos Englebert et al.?", "muligheder": ["Suffocation", "Dismemberment", "Divide-and-rule", "Defensiv modernisering"], "rigtig": 0, "forklaring": "Dismemberment er, når en gruppe splittes af en grænse. Suffocation er, når forskellige grupper presses sammen, som i Irak, der blev sat sammen af provinserne Baghdad, Basra og Mosul. Begge dele øger heterogeniteten. Hariri finder dog ikke, at grænsekunstighed forklarer MENA-underskuddet.", "id": "DAK3-21"}, {"type": "mc", "kilde": "slides", "side": "s. 68", "tekst": "Hvordan håndterer Nunn (2008) endogenitetsproblemet i studiet af slavehandlens langsigtede effekter?", "muligheder": ["Han bruger afstanden til havne, der importerede slaver, som instrument", "Han sammenligner kun lande, der aldrig eksporterede slaver, med hinanden", "Han bruger tidspunktet for den neolitiske revolution som instrument", "Han kontrollerer for kolonimagt og antager, at resten af variationen er kausal"], "rigtig": 0, "forklaring": "Problemet er, at slavehandlen måske var størst i områder, der i forvejen var mindst udviklede. Instrumentet virker, hvis havnene ikke selv lå, hvor der var slaver at få, og hvis afstanden kun påvirker udviklingen gennem slaveeksporten.", "id": "DAK3-22"}, {"type": "åben", "kilde": "herb", "side": "s. 10–11", "tekst": "Herb tilbyder en ‘lille nyfortolkning’ af ressourceforbandelsen. Forklar den.", "svar": "Klassisk rentierteori siger, at olie gør lederne uafhængige af skatteyderne og derfor autoritære. Herb påpeger, at teorien siger, at rentierstater bliver autoritære, men ikke hvordan. Den forklarer heller ikke, hvem der overlever: Iran, Irak og Libyen var olierige og faldt.\n\nHans pointe er, at olie virker gennem de eksisterende institutioner. Olieindtægterne fik statsapparatet og regeringerne til at vokse lynhurtigt, og i Golfen stod herskerens slægtninge klar til at besætte de nye poster (Kuwait 1938). Olien muliggjorde altså det dynastiske monarki, og det er det dynastiske monarki, ikke olien i sig selv, der giver stabilitet.", "id": "DAK3-23"}, {"type": "åben", "kilde": "herb", "side": "s. 4, 7–10", "tekst": "Autokrater skal håndtere trusler fra (1) masserne og (2) eliten. Handler Herbs argument om (1), (2) eller begge – og kan det forklare monarkiernes modstandskraft under Det Arabiske Forår?", "svar": "Primært (2). Dynastisk monarki løser eliteproblemet ved at fordele magten og regulere arvefølgen inden for familien (konsensus og bandwagoning), så eliten ikke splittes. Plato: revolution begynder med splid i den herskende klasse.\n\nIndirekte også (1): Familierne har ‘multitudinous contacts’ med samfundet, og monarker kan liberalisere gradvist, fordi de kan holde valg og stadig være monarker.\n\nArabisk Forår: De regimer, der faldt, var republikker, mens monarkierne i det store hele overlevede. Det passer med Herb. Men Jordan og Marokko er ikke dynastiske, så forklaringen er ikke udtømmende.", "id": "DAK3-24"}, {"type": "åben", "kilde": "hariri", "side": "slides s. 34–35", "tekst": "Gengiv Hariris to-trins-argument og de fire hypoteser (A1, A2, B1, B2).", "svar": "Trin 1: Førkolonial statsudvikling påvirkede, om og hvordan et land blev koloniseret.\nTrin 2: Koloniseringens mønster påvirkede den langsigtede regimeudvikling.\n\nA1: Mere udviklede stater var sværere at kolonisere og fik mindre europæisk bosættelse.\nA2: Lande uden europæisk bosættelse forblev oftere autokratiske.\nB1: Hvis de blev koloniseret, blev ældre stater mest styret indirekte.\nB2: Indirekte styrede lande forblev oftere autokratiske.\n\nDertil kommer, at tidlig statsdannelse i sig selv gjorde det lettere at kontrollere intern opposition og legitimerede de traditionelle eliter.", "id": "DAK3-25"}, {"type": "åben", "kilde": "lange", "side": "slides s. 12–15", "tekst": "Hvorfor gav direkte styre bedre udviklingsbetingelser end indirekte styre ifølge Lange?", "svar": "Direkte styre skabte et relativt stærkt, sammenhængende og meritokratisk (weberiansk) bureaukrati, der styrede ensartet i hele territoriet. Staten var lokalt til stede og tilgængelig for indbyggerne som borgere og som ansatte (en bureaukratisk ‘kravlegård’). Det gav inkluderende stater med høj infrastrukturel magt, som kunne gennemføre udviklingspolitik.\n\nIndirekte styre gav personaliserede, ekskluderende stater med lav infrastrukturel magt. Høvdingene blev kun ansvarlige opad (decentraliseret despoti), magtstrukturerne blev fastfrosset, og staten blev todelt: en kvasi-moderne hovedstad og traditionelle lokale forvaltninger. Resultatet var ‘developmental bads’, både økonomisk og politisk.", "id": "DAK3-26"}]}, {"kode": "EP", "navn": "Integration, disintegration og kriser", "tekster": [{"id": "hm09", "label": "Hooghe & Marks 2009", "kort": "Hooghe 2009 - A Postfunctionalist Theory of European Integration", "læst": false}, {"id": "hm19", "label": "Hooghe & Marks 2019", "kort": "Hooghe 2019 - Grand Theories of European Integration in the Twenty-First Century", "læst": false}, {"id": "jones", "label": "Jones et al. 2021", "kort": "Jones 2021 - Failing Forward", "læst": false}, {"id": "slides", "label": "Forelæsning F04"}], "spørgsmål": [{"type": "mc", "kilde": "hm09", "side": "s. 1–2", "tekst": "Hvilke tre ‘irreducible logics’ former ifølge Hooghe & Marks præferencer for den jurisdiktionelle arkitektur?", "muligheder": ["Effektivitet, distribution og identitet", "Effektivitet, legitimitet og suverænitet", "Spillover, supranational aktivisme og læring", "Interesser, institutioner og idéer"], "rigtig": 0, "forklaring": "Neofunktionalisme og LI ser præferencer som økonomiske (effektivitet og distribution). Postfunktionalismens bidrag er identitet. Styring er både et middel til kollektive goder og et udtryk for fællesskab, og borgerne bekymrer sig ‘passionately’ om, hvem der udøver autoritet over dem.", "id": "EP-01"}, {"type": "mc", "kilde": "hm09", "side": "s. 5–6, 21", "tekst": "Hvad markerer overgangen fra ‘permissive consensus’ til ‘constraining dissensus’?", "muligheder": ["Maastricht-traktaten (1991–92) og det danske nej", "De første direkte valg til Europa-Parlamentet i 1979", "De Gaulles tomme stols-krise i 1965–66", "Østudvidelsen med ti nye medlemsstater i 2004"], "rigtig": 0, "forklaring": "Frem til omkring 1991 kunne isolerede eliter indgå aftaler, mens befolkningen var passiv. Siden har partilederne i regering måttet ‘look over their shoulders’. De direkte valg fra 1979 ændrede ifølge H&M ikke det elitecentrerede billede, fordi europavalg blot var popularitetstests for de nationale regeringer.", "id": "EP-02"}, {"type": "mc", "kilde": "hm09", "side": "s. 2", "tekst": "Hvorfor kaldes teorien ‘post’-funktionalistisk?", "muligheder": ["Den er agnostisk over for, om de jurisdiktioner, der skabes, er effektive", "Den mener, at funktionelt pres er holdt helt op med at spille en rolle", "Den er udviklet efter den kolde krig og afløser neofunktionalismen helt", "Den antager, at integrationen altid ender i et funktionelt optimalt føderalt system"], "rigtig": 0, "forklaring": "Ligesom NF og LI ser H&M et mismatch mellem effektivitet og den eksisterende autoritetsstruktur som det, der sætter integrationen i gang. Men de antager ikke, at udfaldet afspejler det funktionelle pres. ‘Political conflict makes all the difference.’", "id": "EP-03"}, {"type": "mc", "kilde": "hm09", "side": "s. 8–9", "tekst": "Hvad afgør ifølge H&M's model (Figur 2), om konflikten om et EU-spørgsmål præges af identitet eller distribution?", "muligheder": ["Hvilken arena spørgsmålet afgøres i – massepolitik eller interessegrupper", "Om spørgsmålet vedrører ‘high politics’ (suverænitet) eller ‘low politics’", "Om det er Kommissionen eller Rådet, der har initiativretten på området", "Hvor stor den økonomiske gevinst ved integration er for medlemsstaterne"], "rigtig": 0, "forklaring": "Modellen har fem trin: (1) reform impetus (mismatch), (2) issue creation, (3) arena rules, fx regler om folkeafstemninger, (4) arena choice, som partierne står for, og (5) konfliktstruktur. Arenaen er både afhængig og uafhængig variabel.", "id": "EP-04"}, {"type": "mc", "kilde": "hm09", "side": "s. 8–9, 13", "tekst": "Hvad er ifølge H&M det afgørende, der har ændret sig siden 1985?", "muligheder": ["Beslutningerne er rykket fra en isoleret elite til massepolitik", "Befolkningens støtte til EU-medlemskab er styrtdykket siden 1985", "Eliterne er i dag blevet mere EU-skeptiske end befolkningen", "Interessegrupperne har overtaget beslutningerne fra partierne"], "rigtig": 0, "forklaring": "Nettostøtten i 2005 er ikke meget lavere end i 1985 (Fig. 3). ‘Even if preferences have not changed much, the game has.’ Eliterne er stadig langt mere pro-EU end befolkningen: Kløften var fx 54 % i Tyskland og 57 % i Sverige i 1996.", "id": "EP-05"}, {"type": "mc", "kilde": "hm09", "side": "s. 12–13", "tekst": "Hvornår fører en stærk national identitet til EU-skepsis ifølge H&M?", "muligheder": ["Når den er eksklusiv og aktiveres (‘cued’) af partier", "Altid – jo stærkere national tilknytning, jo mere EU-skepsis", "Kun når personen også er økonomisk taber på det indre marked", "Aldrig – identitet påvirker kun eliter, ikke befolkningen"], "rigtig": 0, "forklaring": "Man kan godt have en stærk national tilknytning og være positiv over for EU. Det afgørende er, om identiteten er eksklusiv eller inkluderende. De Vries og Edwards viser, at jo stærkere det populistiske højre er, jo mere EU-skeptiske bliver personer med eksklusiv identitet. Personer med inkluderende identitet påvirkes ikke.", "id": "EP-06"}, {"type": "mc", "kilde": "hm09", "side": "s. 13", "tekst": "Hvad er ‘framing’ i H&M's beskrivelse af, hvordan EU-holdninger konstrueres?", "muligheder": ["At forbinde en bestemt overvejelse med et politisk objekt", "At gøre en bestemt overvejelse fremtrædende (salient)", "At indpode en bias gennem signaler fra et parti eller en leder", "At flytte en beslutning fra interessegruppearenaen til massearenaen"], "rigtig": 0, "forklaring": "Priming er at gøre en overvejelse salient, framing er at forbinde den med et politisk objekt, og cueing er at indpode en bias. Holdninger til EU er særligt modtagelige for konstruktion, fordi EU er et fjernt, abstrakt og nyt objekt.", "id": "EP-07"}, {"type": "mc", "kilde": "hm09", "side": "s. 16–17", "tekst": "Hvilken dimension viste sig at forklare partiernes EU-holdninger bedst i H&M's ekspertsurvey?", "muligheder": ["GAL/TAN-dimensionen (kulturel/identitetsmæssig)", "Den økonomiske venstre-højre-dimension (stat mod marked)", "Center-periferi-dimensionen fra Lipset & Rokkan", "By-land-dimensionen (landbrug mod industri)"], "rigtig": 0, "forklaring": "H&M forventede, at venstre-højre ville dominere, men GAL/TAN overskyggede den. De mener, at sammenhængen går gennem national identitet. TAN-partier som Front National og FPÖ afviser integration af samme grund som immigration: begge underminerer det nationale fællesskab.", "id": "EP-08"}, {"type": "mc", "kilde": "hm09", "side": "s. 18", "tekst": "Hvorfor er partikonflikten om EU simplere og mere polariseret i Central- og Østeuropa?", "muligheder": ["GAL/TAN og venstre/højre forstærker hinanden i stedet for at krydse", "Der findes ingen egentlige TAN-partier i de postkommunistiske lande", "Alle partierne dér er enige om at støtte EU-medlemskab uden forbehold", "Venstre/højre-dimensionen forsvandt helt efter kommunismens fald"], "rigtig": 0, "forklaring": "I Vesteuropa kommer EU-skepsis fra to forskellige partityper, TAN-partierne og den radikale venstrefløj. I øst er de to kilder smeltet sammen: Venstrepartier har tendens til at være TAN, og TAN-partier har tendens til at være venstreorienterede.", "id": "EP-09"}, {"type": "mc", "kilde": "hm09", "side": "s. 19–21", "tekst": "Hvilke overvejelser styrer ifølge H&M, om partiledere vil politisere EU-spørgsmålet?", "muligheder": ["Vælgerpotentiale, ideologisk omdømme og risikoen for at splitte partiet", "Kommissionens dagsorden, Domstolens praksis og Rådets afstemningsregler", "Landets BNP, nettobidraget til EU-budgettet og handelsbalancen", "Interessegruppernes pres, mediernes dækning og Eurobarometer-målinger"], "rigtig": 0, "forklaring": "Mainstreampartierne har holdt sig fra spørgsmålet, fordi det går på tværs af venstre-højre og splitter dem (fx de britiske konservative). Derfor er debatten formet af EU's modstandere: populistiske TAN-partier, nationalister i de konservative partier og den radikale venstrefløj.", "id": "EP-10"}, {"type": "mc", "kilde": "hm09", "side": "s. 13", "tekst": "Hvilken af følgende er IKKE en af H&M's betingelser for, at identitet bliver kausalt vigtig for et spørgsmål?", "muligheder": ["Spørgsmålet har gennemsigtige økonomiske konsekvenser for vælgerne", "Spørgsmålet har gennemsigtige konsekvenser for fællesskabet", "Spørgsmålet debatteres i offentlige fora", "Spørgsmålet drives af masseorganisationer frem for specialiserede interessegrupper"], "rigtig": 0, "forklaring": "Betingelserne er (a) uigennemsigtige økonomiske implikationer, (b) gennemsigtige implikationer for fællesskabet, (c) debat i offentlige fora og (d) masseorganisationer frem for specialiserede grupper. Når de økonomiske konsekvenser er tydelige, fylder distribution mere.", "id": "EP-11"}, {"type": "mc", "kilde": "hm09", "side": "s. 22", "tekst": "Hvordan forudser H&M, at politiske ledere vil reagere på politiseringen?", "muligheder": ["De vil bruge mindre reformpakker, opt-outs og ikke-majoritære agenturer", "De vil holde flere folkeafstemninger for at genvinde den tabte legitimitet", "De vil opgive traktatændringer helt og lade EU stagnere permanent", "De vil lade Europa-Parlamentet vedtage traktatændringer uden medlemsstaterne"], "rigtig": 0, "forklaring": "H&M mener ikke, at politiseringen kan ‘stuffes tilbage i posen’. I stedet vil den stimulere beslutningsreformer, der sænker temperaturen, bl.a. ved at undgå folkeafstemninger.", "id": "EP-12"}, {"type": "mc", "kilde": "hm19", "side": "s. 1115", "tekst": "Hvilken mikrofundering og kausallogik har neofunktionalismen ifølge Hooghe & Marks (2019)?", "muligheder": ["Begrænset rationalitet og stiafhængighed med sunk costs", "Fuldt rationelle stater, der forhandler ud fra relativ magt og asymmetri", "Politisk psykologi, hvor identitet vejer tungere end økonomisk interesse", "Normer og idéer, der socialiserer eliter til en fælles europæisk identitet"], "rigtig": 0, "forklaring": "Fuldt rationelle stater og asymmetrisk afhængighed er LI, og identitet over interesser er postfunktionalismen. Tidligere integration skaber uforudsete kriser, og sunk costs gør det svært at vende om. NF forventer en takket, men opadgående kurve.", "id": "EP-13"}, {"type": "mc", "kilde": "hm19", "side": "s. 1122–1124", "tekst": "Hvilken teori har ifølge H&M størst forklaringskraft for Brexit – og hvordan ser LI på Brexit?", "muligheder": ["Postfunktionalismen; LI kalder Brexit ‘illusorisk’", "Neofunktionalismen; LI ser Brexit som starten på EU's opløsning", "LI; postfunktionalismen ser Brexit som et rent økonomisk valg", "Neofunktionalismen; PF kan ikke forklare folkeafstemningen"], "rigtig": 0, "forklaring": "PF forklarer beslutningen om at holde afstemningen (Cameron ville stoppe UKIP), en debat hvor siderne aldrig mødtes (økonomi mod selvbestemmelse), og at immigration blev afgørende. NF og LI fremhæver den økonomiske gensidige afhængighed, der taler imod et hårdt Brexit.", "id": "EP-14"}, {"type": "mc", "kilde": "hm19", "side": "s. 1120–1122", "tekst": "Hvordan forklarer LI udfaldet af migrationskrisen 2015–16?", "muligheder": ["De mindst berørte stater kunne blokere, uden at det kostede dem noget", "Transnational finans pressede på for dybere integration for at redde Schengen", "Kommissionen fik gennemført sin fordelingsnøgle for 160.000 flygtninge", "Nationale identiteter blev overvundet af en fælles europæisk solidaritet"], "rigtig": 0, "forklaring": "Til forskel fra eurokrisen var der ingen eksistentiel trussel. Selv en suspension af Schengen ville ikke vælte økonomien, og kun menneskerettighedsgrupper pressede på. Resultatet blev den laveste fællesnævner. NF forklarer derimod den gradvise styrkelse af Frontex, og PF forklarer den identitetspolitiske polarisering.", "id": "EP-15"}, {"type": "mc", "kilde": "hm19", "side": "s. 1118–1120", "tekst": "Hvordan forklarer neofunktionalismen eurokrisen?", "muligheder": ["Som utilsigtet spillover fra en ‘halvbagt’ ØMU, der endte i mere supranationalisme", "Som adskilte mellemstatslige forhandlinger, hvor de nordlige lande dikterede vilkårene", "Som resultatet af nationalistiske partiers pres, der lammede de nationale regeringer", "Som et eksogent chok fra USA uden nogen varig effekt på EU's institutioner"], "rigtig": 0, "forklaring": "ØMU fjernede den monetære fleksibilitet uden en forsikring mod asymmetriske chok. Stiafhængighed betød, at euroen blev reddet frem for at blive opgivet, med bankunion, ECB's ‘whatever it takes’ og mere makroøkonomisk koordinering til følge. De nordlige landes dominans i forhandlingerne er LI's forklaring, nationalistisk lammelse er PF's.", "id": "EP-16"}, {"type": "mc", "kilde": "hm19", "side": "s. 1117", "tekst": "Hvad adskiller postfunktionalismen fra NF og LI, når det gælder mulige udfald?", "muligheder": ["Kun PF ser disintegration som et muligt udfald", "Kun PF forventer, at integrationen altid bevæger sig fremad over tid", "Kun PF mener, at resultatet typisk bliver den laveste fællesnævner", "Kun PF tillader, at integrationen kan gå i stå i længere perioder"], "rigtig": 0, "forklaring": "NF og LI ser integration som samarbejde, hvor divergerende præferencer i værste fald giver deadlock (status quo). PF ser en kulturel kløft som ved den nationale statsdannelse, og derfor kan udfaldet også være disintegration.", "id": "EP-17"}, {"type": "mc", "kilde": "hm19", "side": "s. 1125–1128", "tekst": "Hvorfor har EU ifølge et mellemstatsligt perspektiv svært ved at sanktionere Ungarn og Polen via artikel 7?", "muligheder": ["Brud kræver enstemmighed minus den anklagede, så de to kan dække hinanden", "EU-Domstolen har konsekvent afvist at behandle sager om national retsstat", "Europa-Parlamentet har ikke kompetence til at sætte proceduren i gang", "Artikel 7 gælder kun for medlemsstater, der står uden for eurozonen"], "rigtig": 0, "forklaring": "NF peger i stedet på Kommissionens og Domstolens aktivisme, fx sagen om de portugisiske dommere (C-64/16), der fastslog et krav om uafhængige nationale domstole. PF forklarer illiberalismens nationalistiske folkelige basis. Parlamentet stemte i 2018 med to tredjedeles flertal for at aktivere artikel 7 mod Ungarn.", "id": "EP-18"}, {"type": "mc", "kilde": "jones", "side": "s. 1519–1521", "tekst": "Hvad beskriver ‘failing forward’-mønsteret?", "muligheder": ["Ufuldstændige aftaler sår kimen til kriser, der driver videre integration", "EU fejler så ofte, at medlemsstaterne gradvist trækker kompetencer tilbage", "Supranationale aktører udnytter hver krise til komplette føderale løsninger", "Kriser får befolkningerne til at kræve integration, som eliterne modvilligt leverer"], "rigtig": 0, "forklaring": "Gåden fra eurokrisen var, at lederne vedtog minimale nødløsninger, selvom mange vidste, at de var uholdbare. Alligevel bevægede løsningerne over tid EU mod dybere integration.", "id": "EP-19"}, {"type": "mc", "kilde": "jones", "side": "s. 1521", "tekst": "Hvordan kombinerer failing forward-rammen de store integrationsteorier?", "muligheder": ["LI forklarer de kortsigtede forhandlinger, NF den langsigtede uddybning", "NF forklarer de kortsigtede forhandlinger, LI den langsigtede uddybning", "Postfunktionalismen forklarer kriserne, LI forklarer løsningerne", "Begge afvises til fordel for en ny konstruktivistisk tilgang"], "rigtig": 0, "forklaring": "Teorierne ses normalt som gensidigt udelukkende, men her virker de i tandem, på forskellige tidspunkter og i forskelligt tempo.", "id": "EP-20"}, {"type": "mc", "kilde": "jones", "side": "s. 1525", "tekst": "Hvilke tre scope conditions gør failing forward mere sandsynligt?", "muligheder": ["Kriseintensitet, EU-kompetence og omkostningen ved at gå tilbage", "Folkelig støtte, Tysklands position og hvem der er kommissionsformand", "Enstemmighed i Rådet, flertal i Parlamentet og ECB's mandat", "Økonomisk vækst, lav arbejdsløshed og stabile regeringer"], "rigtig": 0, "forklaring": "Jones et al. understreger, at failing forward ikke er den eneste måde, integration sker på. Monnets ‘Europe will be forged in crises’ er eksplicit ikke deres argument.", "id": "EP-21"}, {"type": "mc", "kilde": "jones", "side": "s. 1526", "tekst": "Hvilke egenskaber skal en krise have for at udløse failing forward?", "muligheder": ["Omfattende, ukendt og eksistentiel", "Kortvarig, lokal og forudsigelig", "Eksogen, økonomisk og symmetrisk", "Mediebåren, politiseret og folkeafstemningsudløst"], "rigtig": 0, "forklaring": "Finanskrisen og COVID-19 havde alle tre egenskaber. Retsstatskrisen, Brexit og ustabile nabolande kan være lige så alvorlige, men de er ‘slower burning’ og lettere at bagatellisere retorisk.", "id": "EP-22"}, {"type": "mc", "kilde": "jones", "side": "s. 1527–1530", "tekst": "Hvor på kompetencespektret forventer Jones et al. oftest at se failing forward?", "muligheder": ["I midten, hvor kompetencen er delt (fx ØMU)", "Hvor EU har eksklusiv kompetence (fx handel og konkurrence)", "Hvor EU slet ingen kompetence har (fx forsvar og sikkerhed)", "Der er ingen sammenhæng mellem kompetence og failing forward"], "rigtig": 0, "forklaring": "Uden kompetence har de supranationale aktører ingen løftestang (CSDP, naboskabspolitikken), og med eksklusiv kompetence er der få muligheder for at uddybe. I midten kan fejl tilskrives ufuldstændige EU-institutioner, og Kommissionen kan sætte dagsordenen, som med SURE-programmet under pandemien.", "id": "EP-23"}, {"type": "mc", "kilde": "jones", "side": "s. 1523–1524", "tekst": "Hvad mener Jones et al. med ‘forward’?", "muligheder": ["Dybere integration – men hverken teleologisk eller normativt ment", "At EU bevæger sig mod en føderal stat, som er processens mål", "At politikken bliver bedre og mere effektiv efter hver krise", "At EU optager nye medlemsstater i kølvandet på hver krise"], "rigtig": 0, "forklaring": "‘Just because Europe is moving forward does not mean it is getting better.’ Forward kan også betyde udvidelse, og det kan gå hånd i hånd med decentral håndhævelse, som i konkurrencepolitikken.", "id": "EP-24"}, {"type": "mc", "kilde": "jones", "side": "s. 1531–1532", "tekst": "Hvorfor ‘failed EU to fail forward’ i retsstatskrisen ifølge Emmons & Pavone?", "muligheder": ["Modstandere brugte ‘rhetorics of inaction’ til at undskylde passivitet", "Krisen var så intens, at EU i stedet valgte fuld føderalisering", "EU havde eksklusiv kompetence og behøvede derfor ikke at handle", "Omkostningen ved at gå tilbage var så høj, at ingen turde handle"], "rigtig": 0, "forklaring": "Pointen er, at agency kan blokere dynamikken, selv når der er funktionelt pres. Kelemen sammenligner det med at indrette en toiletafdeling i et svømmebassin: problemet bliver ikke i sit hjørne.", "id": "EP-25"}, {"type": "mc", "kilde": "slides", "side": "s. 23", "tekst": "Romano Prodi sagde i 2001 ved lanceringen af euroen: ‘some day there will be a crisis and …’ – hvad?", "muligheder": ["‘… new instruments will be created’", "‘… the euro will be abandoned’", "‘… the member states will take back control’", "‘… the Commission will be blamed’"], "rigtig": 0, "forklaring": "Citatet fra Jones et al. 2016 illustrerer failing forward-logikken. Man vidste, at euroen krævede nye økonomisk-politiske instrumenter, men de var politisk umulige at foreslå, før en krise tvang dem frem.", "id": "EP-26"}, {"type": "mc", "kilde": "jones", "side": "s. 1530–1531", "tekst": "Hvorfor valgte Grækenland og Cypern kapitalkontrol frem for at forlade euroen?", "muligheder": ["Det er lettere midlertidigt at suspendere en frihed end at forlade euroen", "EU-traktaten forbyder under alle omstændigheder udtræden af eurozonen", "Kapitalkontrol var en betingelse for at få adgang til nye EU-midler", "Befolkningerne stemte for kapitalkontrol ved nationale folkeafstemninger"], "rigtig": 0, "forklaring": "Det er lock-in-betingelsen: Jo sværere det er at bakke, jo mere sandsynligt er det, at man flygter fremad, ligesom bilisten, der er strandet midt i krydset. Selv skeptiske medlemsstater foretrak at holde landene i euroen.", "id": "EP-27"}, {"type": "åben", "kilde": "hm19", "side": "s. 1116–1117, 1123–1124", "tekst": "Anvend postfunktionalismens tretrinslogik (mismatch → arenavalg → konfliktstruktur) på Brexit.", "svar": "Mismatch: Økonomisk gensidig afhængighed og EU-regler (fri bevægelighed, indre marked) stødte sammen med ønsket om national selvbestemmelse.\n\nArenavalg: Cameron flyttede spørgsmålet til massearenaen med en folkeafstemning for at neutralisere UKIP og dæmpe den EU-afvisende fløj i De Konservative (arena rules gjorde det muligt).\n\nKonfliktstruktur: I massearenaen blev konflikten identitetsbaseret. Leave talte om selvbestemmelse og immigration, Remain om økonomi, og de to sider mødtes aldrig. Et binært valg gav ‘a single bit of information’ om et komplekst spørgsmål. Resultatet var ikke ‘økonomisk rationelt’, og polariseringen er siden blevet hårdere. ‘Nationalism can subvert multilevel governance.’", "id": "EP-28"}, {"type": "åben", "kilde": "hm19", "side": "s. 1118–1120", "tekst": "Hvordan forklarer henholdsvis LI, NF og PF eurokrisen? Er forklaringerne gensidigt udelukkende?", "svar": "LI: Gentagne mellemstatslige forhandlinger præget af gensidig afhængighed og asymmetri, med Grækenland m.fl. som afhængige parter. Resultatet blev laveste-fællesnævner-aftaler, der minimerede Nordens kortsigtede omkostninger.\n\nNF: Krisen var en utilsigtet spillover fra en halvbagt ØMU. Stiafhængighed betød, at euroen blev reddet, og det gav mere supranationalisme (ECB, bankunion, makroøkonomisk overvågning).\n\nPF: Nationalistisk opposition lammede regeringerne, og finanspolitisk union var umulig. Man depolitiserede via ikke-majoritære institutioner, og svaret blev delvist, forsinket og Pareto-inferiort.\n\nH&M: Forklaringerne er komplementære, fordi de stiller forskellige spørgsmål. Jones et al. kombinerer eksplicit LI (kort sigt) og NF (lang sigt).", "id": "EP-29"}, {"type": "åben", "kilde": "jones", "side": "s. 1524", "tekst": "Hvad kan krisedrevet integration (failing forward) betyde for EU's legitimitet?", "svar": "Nødløsninger, der sår kimen til nye problemer, kan give indtryk af, at ‘the EU is rudderless and in a perpetual state of crisis’. Jo mere EU-løsninger ser ud til at fejle eller skabe fremtidige problemer, jo hurtigere bliver permissive consensus til constraining dissensus (Hooghe & Marks). Dynamikken kan altså være selvundergravende.\n\nDet modsiges dog delvist af, at støtten til EU og euroen steg igen efter kriserne. EU's første snublen under COVID og faldende tillid til EU-Domstolen har genoplivet bekymringen.", "id": "EP-30"}, {"type": "åben", "kilde": "hm09", "side": "s. 18; slides s. 13", "tekst": "Nævn postfunktionalismens fire forventninger om GAL/TAN og europæisk integration.", "svar": "1) Integration forstærker en tidligere sekundær, ikke-økonomisk identitetsdimension (præ-materielle værdier om gruppetilhørsforhold).\n2) Det er dårligt nyt for mainstreampartierne, fordi dimensionen ikke kan rummes på venstre-højre-skalaen og risikerer at splitte deres vælgere.\n3) Når integrationen udvides til ikke-økonomiske områder, bliver EU-skepsis mere TAN.\n4) Politiseringen er størst i lande med populistiske TAN-partier.", "id": "EP-31"}]}, {"kode": "PA", "navn": "Issue mobilisation", "tekster": [{"id": "berkhout", "label": "Berkhout 2013", "kort": "Berkhout 2013 - Why Interest Organizations Do What They Do", "læst": true}, {"id": "crepaz", "label": "Crepaz et al. 2022, kap. 3", "kort": "Crepaz 2022 - Viral Lobbying kap. 3 Issue Mobilisation", "læst": false}, {"id": "fraussen", "label": "Fraussen et al. 2021", "kort": "Fraussen 2021 - Why Do Interest Groups Prioritise Some Issues", "læst": false}, {"id": "stevens", "label": "Stevens 2026", "kort": "Stevens 2026 - Anticipating Nightmare Issues", "læst": false}], "spørgsmål": [{"type": "mc", "kilde": "berkhout", "side": "s. 227, 245", "tekst": "Hvilke tre ‘logics of exchange’ strukturerer Berkhouts model?", "muligheder": ["Logic of support, logic of influence og logic of reputation", "Logic of membership, logic of access og logic of voice", "Logic of collective action, logic of exit og logic of loyalty", "Logic of influence, logic of negotiation og logic of protest"], "rigtig": 0, "forklaring": "Support dækker udvekslingen med medlemmer og støtter, influence udvekslingen med beslutningstagere og reputation udvekslingen med nyhedsmedier og offentlighed. Berkhout omdøber Schmitter & Streecks ‘logic of membership’ til ‘logic of support’, så virksomheder og donationsbaserede organisationer også er dækket.", "id": "PA-01"}, {"type": "mc", "kilde": "berkhout", "side": "s. 228, 231", "tekst": "Hvad tilføjer Berkhout (2013) til Salisbury (1969)?", "muligheder": ["Beslutningstagere og medier – og at relationerne er gensidigt afhængige", "Lobbyisme over for parlament og ministre, som Salisbury helt overser", "Han erstatter exchange-perspektivet med ressourceafhængighedsteori", "Han overfører Salisburys teori fra USA til EU uden væsentlige ændringer"], "rigtig": 0, "forklaring": "Salisbury handler om gruppedannelse: Entreprenører investerer i goder og tilbyder dem til medlemmer for prisen ‘medlemskab’. Berkhout modsiger ham ikke, men specificerer de ekstra begrænsninger, der følger af flere samtidige udvekslingsrelationer. Studier, der kun ser på én relation, risikerer ‘underspecification’.", "id": "PA-02"}, {"type": "mc", "kilde": "berkhout", "side": "s. 230", "tekst": "Hvordan definerer Berkhout (efter Emerson) en ressource?", "muligheder": ["En relationel evne til at belønne eller straffe en bestemt anden aktør", "Organisationens samlede budget og antallet af fuldtidsansatte", "Al den information om lovgivningen, som organisationen besidder", "Medlemmernes kontingenter og donationer til organisationen"], "rigtig": 0, "forklaring": "Ressourcer er ‘not possessions or attributes of individual actors, but rather attributes of the relationship between actors’. Selve udvekslingen defineres som en interaktion, der er frivillig, gensidig og til fælles fordel.", "id": "PA-03"}, {"type": "mc", "kilde": "berkhout", "side": "s. 234 (Tabel 1)", "tekst": "Hvad leverer interesseorganisationen ifølge Berkhouts Tabel 1 til beslutningstagerne?", "muligheder": ["Støtternes disciplin og ‘acceptable’ policy frames", "Begivenheder (‘drama and action’) og nyhedsinput", "Organisatoriske privilegier og rettidig information om politikændringer", "Latent støtte og validering"], "rigtig": 0, "forklaring": "Til gengæld efterspørger organisationen privilegier, gunstig politik og rettidig information fra beslutningstagerne. Over for journalister leverer den events og nyhedsinput og får latent støtte, opmærksomhed og validering.", "id": "PA-04"}, {"type": "mc", "kilde": "berkhout", "side": "s. 242–243", "tekst": "I Kollmans typologi (gengivet af Berkhout) har et spørgsmål høj popularitet i befolkningen, men lav salience. Hvilken type politik er det – og hvad gør gruppen?", "muligheder": ["‘Latent support politics’ – gruppen søger medierne for at øge saliencen", "‘Comforting politics’ – gruppen søger medierne, fordi støtten er høj", "‘Classical interest group politics’ – gruppen undgår at udvide konflikten", "‘Elitist politics’ – gruppen holder sig fra medierne og lobbyer indefra"], "rigtig": 0, "forklaring": "Høj popularitet og høj salience giver comforting politics. Lav popularitet og høj salience (for støtterne) giver klassisk interessegruppepolitik. Lav popularitet og lav salience giver elitist politics, hvor gruppen måske ‘astroturfer’ over for beslutningstagerne.", "id": "PA-05"}, {"type": "mc", "kilde": "berkhout", "side": "s. 238–239", "tekst": "Hvilken slags ressourcer foretrækker ifølge Berkhout aktører under direkte valgkontrol, fx parlamentarikere?", "muligheder": ["Ressourcer fra medier og offentlighed (bred politisk støtte)", "Teknisk information om sektoren og om fremtidig compliance", "Finansielle bidrag til partiernes og kandidaternes valgkampe", "Juridisk ekspertise til at formulere konkrete lovtekster"], "rigtig": 0, "forklaring": "Aktører på armslængde af offentligheden, som Kommissionen, foretrækker valgkredsrelaterede ressourcer og teknisk information (Bouwen 2004). Findes der flere venues, kan organisationer venue-shoppe og behøver at levere færre ‘subsidier’ per venue.", "id": "PA-06"}, {"type": "mc", "kilde": "berkhout", "side": "s. 236–237", "tekst": "Hvad forudsiger Berkhout om ledere af organisationer i tætte (dense) interessegruppemiljøer?", "muligheder": ["Mindre kontrol over støtterne, hvis støtte også er mindre værd", "Større kontrol, fordi konkurrencen disciplinerer medlemmerne", "Lettere adgang, fordi beslutningstagere foretrækker mange små grupper", "Tætheden spiller ingen rolle for lederne i Berkhouts model"], "rigtig": 0, "forklaring": "Beslutningstagere foretrækker at udveksle med én bredt funderet organisation per sektor (neo-korporatisme). I tætte miljøer specialiserer grupperne sig i nicher efter taktik, mediekontakter og medlemsbase.", "id": "PA-07"}, {"type": "mc", "kilde": "crepaz", "side": "s. 34, 42–46", "tekst": "Hvilke tre dimensioner af issue mobilisation undersøger Crepaz et al.?", "muligheder": ["Om, hvor hurtigt og hvor intenst de mobiliserer", "Adgang, indflydelse og synlighed i medierne", "Insider-, outsider- og koalitionsstrategier", "Medlemsrekruttering, fundraising og lobbyisme"], "rigtig": 0, "forklaring": "Issue mobilisation er ‘the decision of individual organisations to mobilise on concrete policy issues’, altså når eksisterende organisationer aktiverer deres politiske funktion. Det er noget andet end interesse- og medlemsmobilisering. De tre mål analyseres med henholdsvis logit, ordered logit og negativ binomial regression.", "id": "PA-08"}, {"type": "mc", "kilde": "crepaz", "side": "s. 37–40", "tekst": "Hvilken teoretiker bygger ‘affectedness’-hypotesen (H1) på?", "muligheder": ["Truman – ‘disturbances’ udløser mobilisering", "Olson – kollektive handlingsproblemer og selektive incitamenter", "Salisbury – entreprenører, der tilbyder goder til medlemmer", "Schattschneider – de svage vil socialisere konflikten"], "rigtig": 0, "forklaring": "Pluralisten Truman leverer H1. Olson leverer H2 om grupptype (erhvervsinteresser løser lettere kollektive handlingsproblemer) og H3 om ressourcer via by-product-teorien.", "id": "PA-09"}, {"type": "mc", "kilde": "crepaz", "side": "s. 48–50", "tekst": "Hvad fandt Crepaz et al. om forskellen mellem grupptyper?", "muligheder": ["Ens tilbøjelighed til at mobilisere, men NGO'er var langsommere og mindre intense", "Erhvervsgrupper var langt mere tilbøjelige end andre til overhovedet at mobilisere", "NGO'er og borgergrupper mobiliserede hurtigere, fordi de var mere berørte", "Grupptype havde ingen betydning på nogen af de tre mål for mobilisering"], "rigtig": 0, "forklaring": "Olsonske kollektive handlingsproblemer omsættes altså ikke ‘simpelt’ til issue mobilisation. Diffuse interesser mobiliserer, men ikke lige så hurtigt og vedholdende. Det er stadig en bias, men billedet er mindre dystert end hos Olson.", "id": "PA-10"}, {"type": "mc", "kilde": "crepaz", "side": "s. 49", "tekst": "Hvordan gik det med H4 om, at interne problemer hæmmer mobiliseringen?", "muligheder": ["Ikke understøttet – overbebyrdede medlemmer gav snarere mere mobilisering", "Stærkt understøttet – interne problemer halverede mobiliseringen", "Understøttet for erhvervsgrupper, men ikke for NGO'er og borgergrupper", "Hypotesen kunne ikke testes på grund af manglende data i surveyen"], "rigtig": 0, "forklaring": "Under pandemien overlappede interne udfordringer ofte med politiske forstyrrelser. En professionsforening kunne fx skrive interne sundhedsprotokoller og samtidig lobbye om de samme regler. Effekten ligner derfor affectedness (korrelation 0,19–0,26).", "id": "PA-11"}, {"type": "mc", "kilde": "crepaz", "side": "s. 42, 47–48", "tekst": "Hvor stor er forskellen i den forudsagte sandsynlighed for at mobilisere mellem de mindst og de mest berørte organisationer?", "muligheder": ["Fra 56 % til 94 %", "Fra 12 % til 25 %", "Fra 66 % til 93 %", "Fra 75 % til 80 %"], "rigtig": 0, "forklaring": "66 % mod 93 % er effekten af ressourcer (lille mod stor public affairs-stab). Samlet mobiliserede ca. 75 % af grupperne, og en kerne på ca. 20 % var hurtige og meget aktive og kan fungere som ‘bro’ for bredere interesser.", "id": "PA-12"}, {"type": "mc", "kilde": "crepaz", "side": "s. 40–41", "tekst": "Hvorfor forventede Crepaz et al. (H4), at interne problemer ville hæmme mobiliseringen, med henvisning til Berkhout og Bolleyer?", "muligheder": ["Medlemsservice og politik følger forskellige logikker, så kernen stjæler fokus", "Interne problemer får medlemmer til at melde sig ud, så gruppen mister legitimitet", "Interne problemer gør gruppen mere berørt, hvilket ifølge Truman øger mobilisering", "Interne problemer tvinger gruppen til at outsource sin lobbyisme til konsulenter"], "rigtig": 0, "forklaring": "For mange organisationer er politik en ‘by-product’. Tag en patientforening, hvis selvhjælpsmøder ikke kan flyttes online: Den bruger sin strategiske opmærksomhed på kernen. At interne problemer gør gruppen mere berørt, er i øvrigt den forklaring, der passer til det faktiske fund.", "id": "PA-13"}, {"type": "mc", "kilde": "fraussen", "side": "s. 555", "tekst": "Hvilken af disse er IKKE én af de fem drivere for issue prioritization hos Fraussen et al.?", "muligheder": ["Mediebias", "Intern responsivitet", "Niche seeking", "Political opportunity structure"], "rigtig": 0, "forklaring": "De fem drivere er intern responsivitet, policy capacity, niche seeking, political opportunity structure (POS) og issue salience (Halpin et al. 2018). De to første er interne, de øvrige eksterne.", "id": "PA-14"}, {"type": "mc", "kilde": "fraussen", "side": "s. 562–563, 566–567", "tekst": "Hvad er Fraussen et al.'s overordnede fund om forholdet mellem interne og eksterne drivere?", "muligheder": ["Driverne er positivt korrelerede og ses som forenelige", "Der er en klar trade-off mellem medlemmerne og de politiske muligheder", "Eksterne drivere dominerer, og medlemmerne betyder næsten intet", "Interne drivere dominerer, og salience betyder næsten intet"], "rigtig": 0, "forklaring": "Litteraturen stiller ofte medlemsresponsivitet op mod politiske muligheder, men korrelationerne er positive (om end lave, under 0,3). Prioritering er en ‘balancing act’. Det er ikke dermed let, især ikke for insidere med en bred dagsorden.", "id": "PA-15"}, {"type": "mc", "kilde": "fraussen", "side": "s. 563–565", "tekst": "Hvilket fund var UVENTET hos Fraussen et al.?", "muligheder": ["Generalister lagde mere vægt på intern responsivitet", "Høj medlemsinvolvering gav mere vægt på intern responsivitet", "Adgang gav mere vægt på political opportunity structure", "Større stab gav mere vægt på policy capacity"], "rigtig": 0, "forklaring": "H1 forventede, at generalister ville vægte eksterne faktorer. De vægter salience mere, men også intern responsivitet, så de balancerer. De tre andre fund var forventede. Det var også uventet, at professions- og borgergrupper vægtede niche mere end erhvervsgrupper.", "id": "PA-16"}, {"type": "mc", "kilde": "fraussen", "side": "s. 560", "tekst": "Hvordan måler Fraussen et al. adgang (‘policy insider’)?", "muligheder": ["Mundtlig forklaring for en komité i det australske senat", "Antallet af registrerede ministermøder i et lobbyregister", "Medlemskab af en af Europa-Kommissionens ekspertgrupper", "Gruppens egen vurdering af sin adgang på en skala fra 1 til 5"], "rigtig": 0, "forklaring": "13 % (n = 48) af de 370 australske grupper er insidere. Kommissionens ekspertgrupper er en kontrolvariabel hos Stevens, ikke hos Fraussen.", "id": "PA-17"}, {"type": "mc", "kilde": "fraussen", "side": "s. 564–565", "tekst": "Hvad hænger konkurrence om medlemskontingenter sammen med hos Fraussen et al.?", "muligheder": ["Mere vægt på niche seeking", "Mere vægt på issue salience", "Mindre vægt på intern responsivitet", "Mere vægt på policy capacity"], "rigtig": 0, "forklaring": "Det passer med populationsøkologien: Konkurrence om støtte fra en potentiel valgkreds får grupper til at dele policyrummet op. Adgang hænger også sammen med niche og POS, men ikke med salience, som H2 ellers forventede.", "id": "PA-18"}, {"type": "mc", "kilde": "stevens", "side": "s. 1–2, 10", "tekst": "Hvad er et ‘nightmare issue’ hos Stevens?", "muligheder": ["En alvorlig trussel mod status quo, som endnu ikke er på den formelle dagsorden", "Ethvert lovforslag, gruppen er imod, uanset hvor langt det er i processen", "Et spørgsmål, hvor gruppen selv har fået massiv negativ dækning i medierne", "Et politikområde, hvor gruppen har mistet sin indflydelse til konkurrenter"], "rigtig": 0, "forklaring": "I surveyen skal issuet være specifikt (ikke fx ‘miljø’), ikke formelt prioriteret endnu, noget gruppen vil holde af dagsordenen, og gruppens vigtigste modarbejdede sag. 485 EU-grupper angav et sådant issue.", "id": "PA-19"}, {"type": "mc", "kilde": "stevens", "side": "s. 4–5, 12", "tekst": "Hvad adskiller proaktiv fra reaktiv negativ agenda-setting hos Stevens?", "muligheder": ["Om gruppen handler før eller efter rivaler har rejst sagen", "Om gruppen fremmer sine egne sager eller blokerer andres", "Om gruppen bruger outside lobbying eller inside lobbying", "Om gruppen handler før vedtagelsen eller under implementeringen"], "rigtig": 0, "forklaring": "Begge former hører til Bachrach & Baratz' ‘second face of power’. Proaktiv lobbyisme fungerer som risikostyring eller forsikring. 54,4 % af grupperne svarede proaktiv.", "id": "PA-20"}, {"type": "mc", "kilde": "stevens", "side": "s. 5–8, 11–13", "tekst": "Hvilke tre organisatoriske faktorer styrker ifølge Stevens ‘anticipatory capacity’?", "muligheder": ["Stabsstørrelse, professionalisering og outsourcing", "Medlemstal, organisationens alder og ekspertgruppemedlemskab", "Mediedækning, koalitionsdeltagelse og folkelig opbakning", "Grupptype, krisens hastegrad og issuets kompleksitet"], "rigtig": 0, "forklaring": "Medlemstal, alder, ekspertgrupper, grupptype, krisehastegrad og kompleksitet er kontrolvariabler, og kun krisehastegraden er (svagt) signifikant. Anticipatory capacity er evnen til at forudse nightmare issues ved at opfange og fortolke svage signaler.", "id": "PA-21"}, {"type": "mc", "kilde": "stevens", "side": "s. 5–6", "tekst": "Hvorfor ser Stevens timing primært som et spørgsmål om kapacitet frem for et strategisk valg?", "muligheder": ["Man kan ikke blokere en trussel, man ikke har opdaget i tide", "Alle grupper foretrækker at reagere for ikke at ‘vække den sovende hund’", "Timingen er fastlagt på forhånd af EU's formelle høringsprocedurer", "Proaktiv lobbyisme er ikke tilladt under EU's åbenhedsregister"], "rigtig": 0, "forklaring": "Strategiske valg som inside mod outside eller koalition mod alene forudsætter, at issuet allerede er identificeret. I positiv agenda-setting kommer initiativet fra gruppen selv. I negativ agenda-setting kræver proaktivitet, at truslen opdages tidligt.", "id": "PA-22"}, {"type": "mc", "kilde": "stevens", "side": "s. 18–19", "tekst": "Hvad viser interaktionen mellem stabsstørrelse og professionalisering hos Stevens?", "muligheder": ["Flere ansatte øger kun proaktiviteten i professionaliserede grupper", "Flere ansatte øger proaktiviteten lige meget i alle typer grupper", "Professionalisering betyder kun noget i grupper med én ansat", "Interaktionen er insignifikant, så faktorerne virker uafhængigt"], "rigtig": 0, "forklaring": "I medlemsstyrede grupper mangler de ansatte autoritet og autonomi til at handle på tidlige signaler. Ved én ansat er forskellen (56 % mod 47 %) ikke signifikant.", "id": "PA-23"}, {"type": "mc", "kilde": "stevens", "side": "s. 16–19", "tekst": "Hvilken af Stevens' tre hovedhypoteser får kun ‘tentativ’ støtte i den fulde model?", "muligheder": ["Økonomiske ressourcer", "Professionalisering", "Outsourcing af policy-arbejde", "Ingen – alle tre er robust signifikante"], "rigtig": 0, "forklaring": "Økonomiske ressourcer er kun signifikante på 0,10-niveau. I Model 4 stiger sandsynligheden for proaktivitet fra 52 % (1 ansat) til 76 % (30 ansatte). Professionalisering (46 % → 66 %) og outsourcing (49 % → 70 %) har robust støtte.", "id": "PA-24"}, {"type": "mc", "kilde": "stevens", "side": "s. 4–5", "tekst": "Hvordan adskiller Lukes' ‘third face of power’ sig fra den magt, Stevens studerer?", "muligheder": ["Det former, hvad folk overhovedet finder muligt at diskutere", "Det handler om at vinde de afgørende afstemninger i parlamentet", "Det er proaktiv lobbyisme, mens det andet ansigt er reaktiv", "Det handler om at påvirke implementering frem for dagsordenen"], "rigtig": 0, "forklaring": "Både proaktiv og reaktiv lobbyisme hører til det andet ansigt (Bachrach & Baratz): om et issue bliver prioriteret på den formelle dagsorden. Det første ansigt er de synlige beslutninger.", "id": "PA-25"}, {"type": "åben", "kilde": "berkhout", "side": "s. 233–243", "tekst": "Vælg en interesseorganisation, du kender (fx Danmarks Naturfredningsforening eller Landbrug & Fødevarer), og beskriv dens vigtigste ressourceudvekslinger under Berkhouts tre logikker.", "svar": "Eksempel: Danmarks Naturfredningsforening.\n\nSupport: Medlemmerne leverer kontingent, frivillig deltagelse (fx affaldsindsamlinger, som kan blive nyhedsbegivenheder) og legitimitet. DN giver dem ekspressive goder, synlighed for sagen og medlemsdemokrati (voice).\n\nInfluence: DN leverer ekspertise, acceptable policy frames og information om den folkelige opbakning (‘legislative subsidies’). Til gengæld får DN adgang (høringer, klageret) og rettidig information.\n\nReputation: DN leverer drama, begivenheder og nyhedsinput til journalister og får latent støtte, validering og issue expansion.\n\nPointen er, at relationerne hænger sammen. Mediestøtte gør det lettere at få adgang og hverve medlemmer, mens en for aggressiv outside-kampagne kan koste goodwill hos beslutningstagerne: ‘people in power do not like to sit down with rogues’.", "id": "PA-26"}, {"type": "åben", "kilde": "crepaz", "side": "s. 50–51", "tekst": "Hvad er Crepaz et al.'s hovedfund om drivere af issue mobilisation – og hvordan kan de fortolkes normativt?", "svar": "Fund: Stærkt berørte og ressourcestærke grupper mobiliserede oftere, hurtigere og mere intenst. Grupptype betød ikke noget for om, men NGO'er og borgergrupper var langsommere og mindre intense. Interne problemer hæmmede ikke mobiliseringen.\n\nPositivt: At de mest berørte mobiliserer mest (Truman) betyder, at interessegruppesystemet efter en ‘focusing event’ hælder mod dem, der rammes hårdest, fx sundhedspersonale under COVID. Det giver bredere input og bedre informeret politik.\n\nNegativt: Ressourcer betyder meget (66 % mod 93 % mobiliserer), og ressourceulighed skaber bias tidligt i influence production-processen, fordi grupper med få ressourcer ikke når at mobilisere på nye issues. Eksempel: luftfarten over for forældre- og studentergrupper.\n\nForfatterne er samlet ‘relativt optimistiske’: 75 % mobiliserede.", "id": "PA-27"}, {"type": "åben", "kilde": "fraussen", "side": "s. 566–568", "tekst": "Hvad er Fraussen et al.'s forklaring på interessegruppers policy-dagsordener – og er du overbevist?", "svar": "Forklaring: Grupper prioriterer ud fra fem drivere (intern responsivitet, kapacitet, niche, POS og salience), som de balancerer frem for at vælge imellem. Den relative vægt afhænger af organisatoriske træk: Generalister vægter salience og intern responsivitet, insidere vægter POS og niche, høj medlemsinvolvering giver mere intern responsivitet, og konkurrence om medlemmer giver mere niche. Citatet om detriment, sentiment, policy opportunity og organizational opportunity illustrerer det.\n\nKritikpunkter: selvrapporterede survey-svar, kun ét land (Australien), lav forklaringskraft (R² ca. 0,05–0,13), modellerne behandler driverne hver for sig, selvom interviewene viser, at de hænger sammen, uklar kausal retning (generalist → salience eller omvendt), og målingen sker på gruppeniveau frem for per issue.", "id": "PA-28"}, {"type": "åben", "kilde": "stevens", "side": "s. 20–21", "tekst": "Hvordan kunne ‘svagere’ grupper øge deres kapacitet til at handle proaktivt på nightmare issues?", "svar": "Tag udgangspunkt i Stevens' tre faktorer:\n\n1) Ressourcer: Pool overvågningen i paraplyorganisationer eller koalitioner, og del politisk intelligence og monitoreringsværktøjer.\n2) Professionalisering: Giv de ansatte mandat til at handle på tidlige signaler uden lange medlemsprocesser, fx gennem forhåndsvedtagne positioner eller et hurtigt beslutningsorgan. Det skal afvejes mod den demokratiske legitimitet.\n3) Outsourcing: Del konsulenter, eller brug netværk af akademikere og allierede, der kan advare tidligt.\n\nDerudover kan medlemskab af ekspertgrupper give tidlig information, selvom det var insignifikant i Stevens' model. Normativt peger Stevens på, at strukturelle forskelle i anticipatory capacity bør adresseres for at sikre mangfoldighed i agenda-setting.", "id": "PA-29"}]}]};

// ---------- persistence (sandboxed viewers may block storage) ----------
const KEY = "quiz:" + QUIZ.id;
let mem = {};
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return mem; } }
function save(s){ mem = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
let S = Object.assign({fejl:[], bedst:{}, antal:"10", aabne:true}, load());

// ---------- helpers ----------
const $ = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const app = document.getElementById("app"), foot = document.getElementById("foot"), footin = document.getElementById("footin");
const clean = kids => kids.flat(Infinity).filter(k => k != null && k !== false);
function setFoot(...btns){ btns = clean(btns); footin.replaceChildren(...btns); foot.hidden = !btns.length; }
function screen(...kids){ app.replaceChildren(...clean(kids)); window.scrollTo(0,0); }

const ALL = [];
const TEXT = {};
for (const k of QUIZ.kurser) {
  for (const t of k.tekster) TEXT[k.kode + "/" + t.id] = t;
  for (const q of k.spørgsmål) ALL.push(Object.assign({kursus: k.kode}, q));
}
const textOf = q => TEXT[q.kursus + "/" + q.kilde] || {label: q.kilde};

// ---------- home ----------
function home(){
  const fejl = ALL.filter(q => S.fejl.includes(q.id));
  const seg = $("div", {class:"seg"},
    ["10","Alle"].map(v => $("button", {class: S.antal===v ? "on" : "", onclick(){ S.antal=v; save(S); home(); }}, v === "10" ? "10 tilfældige" : "Alle spørgsmål")));
  const tog = $("label", {class:"tog"},
    $("input", {type:"checkbox", checked: S.aabne, onchange(e){ S.aabne = e.target.checked; save(S); home(); }}),
    "Åbne spørgsmål med (vis svar & vurdér selv)");

  const courses = QUIZ.kurser.map(k => {
    const qs = ALL.filter(q => q.kursus === k.kode);
    const mc = qs.filter(q => q.type === "mc").length, open = qs.length - mc;
    const best = S.bedst[k.kode];
    return $("div", {class:"card"},
      $("div", {class:"row spread"},
        $("div", {}, $("h2", {}, k.kode), $("div", {class:"sub"}, k.navn)),
        best != null ? $("span", {class:"chip acc"}, "Bedst " + best + "%") : null),
      $("div", {class:"texts"}, k.tekster.map(t =>
        $("div", {}, $("span", {}, "• " + t.label), t.læst === false ? $("span", {class:"chip unread"}, "ulæst") : null))),
      $("div", {class:"sub", style:"margin-bottom:10px"}, mc + " multiple choice · " + open + " åbne"),
      $("button", {class:"btn", onclick(){ start(qs, k.kode); }}, "Start " + k.kode));
  });

  screen(
    $("h1", {}, QUIZ.titel),
    $("div", {class:"sub"}, QUIZ.undertitel || ""),
    $("div", {class:"card"}, seg, $("div", {style:"height:12px"}), tog),
    courses,
    $("div", {class:"card"},
      $("button", {class:"btn ghost", onclick(){ start(ALL, "alle"); }}, "Alle kurser blandet"),
      fejl.length ? $("div", {style:"height:10px"}) : null,
      fejl.length ? $("button", {class:"btn ghost", onclick(){ start(fejl, "fejl", true); }}, "Øv mine fejl (" + fejl.length + ")") : null),
    $("div", {style:"text-align:center"}, $("button", {class:"link", onclick(){ if (confirm("Nulstil fejl og bedste resultater?")) { S.fejl=[]; S.bedst={}; save(S); home(); } }}, "Nulstil fremskridt"))
  );
  setFoot();
}

// ---------- quiz ----------
let R;
function start(pool, scope, keepAll){
  let qs = pool.filter(q => S.aabne || q.type === "mc" || scope === "fejl");
  qs = shuffle(qs);
  if (!keepAll && S.antal === "10") qs = qs.slice(0, 10);
  if (!qs.length) return;
  R = {qs, i:0, log:[], scope};
  ask();
}

function header(){
  const q = R.qs[R.i], t = textOf(q);
  return [
    $("div", {class:"qhead"},
      $("div", {class:"row"},
        $("span", {class:"chip acc"}, q.kursus),
        $("span", {class:"chip"}, t.label + (q.side ? " · " + q.side : "")),
        t.læst === false ? $("span", {class:"chip unread"}, "ulæst") : null),
      $("button", {class:"x", "aria-label":"Afslut", onclick(){ R.log.length ? finish() : home(); }}, "×")),
    $("div", {class:"bar"}, $("i", {style:"width:" + (R.i / R.qs.length * 100) + "%"})),
    $("div", {class:"sub"}, "Spørgsmål " + (R.i+1) + " af " + R.qs.length),
  ];
}

function record(q, ok, chosen){
  R.log.push({q, ok, chosen});
  const set = new Set(S.fejl);
  ok ? set.delete(q.id) : set.add(q.id);
  S.fejl = [...set]; save(S);
}

function next(){ R.i++; R.i < R.qs.length ? ask() : finish(); }

function ask(){
  const q = R.qs[R.i];
  if (q.type === "åben") return askOpen(q);
  const order = shuffle(q.muligheder.map((_, i) => i));
  let answered = false;
  const btns = order.map((oi, n) => $("button", {class:"opt", "data-k": "ABCD"[n] || n+1, onclick(){ choose(oi); }}, q.muligheder[oi]));
  const expl = $("div");
  function choose(oi){
    if (answered) return; answered = true;
    const ok = oi === q.rigtig;
    btns.forEach((b, n) => {
      const idx = order[n];
      if (idx === q.rigtig) b.classList.add("ok");
      else if (idx === oi) b.classList.add("bad");
      else b.classList.add("dim");
    });
    expl.replaceChildren($("div", {class:"expl"}, $("b", {}, ok ? "Rigtigt. " : "Forkert. "), q.forklaring || ""));
    record(q, ok, q.muligheder[oi]);
    setFoot($("button", {class:"btn", onclick: next}, R.i+1 < R.qs.length ? "Næste" : "Se resultat"));
    expl.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
  R.key = e => {
    const n = "1234abcd".indexOf(e.key.toLowerCase()) % 4;
    if (!answered && n >= 0 && n < btns.length) choose(order[n]);
    else if (answered && e.key === "Enter") next();
  };
  screen(...header(), $("div", {class:"q"}, q.tekst), ...btns, expl);
  setFoot();
}

function askOpen(q){
  const box = $("div");
  function reveal(){
    box.replaceChildren($("div", {class:"expl answer"}, $("b", {}, "Modelsvar: "), q.svar));
    setFoot(
      $("button", {class:"btn ghost", onclick(){ record(q, false, "(ikke helt)"); next(); }}, "Ikke helt"),
      $("button", {class:"btn", onclick(){ record(q, true, ""); next(); }}, "Kunne det"));
  }
  R.key = e => { if (e.key === "Enter" || e.key === " ") reveal(); };
  screen(...header(),
    $("div", {class:"q"}, q.tekst),
    $("div", {class:"sub"}, "Tænk (eller skriv) dit svar, og sammenlign så med modelsvaret."),
    box);
  setFoot($("button", {class:"btn", onclick: reveal}, "Vis svar"));
}

function finish(){
  R.key = null;
  const n = R.log.length, ok = R.log.filter(l => l.ok).length;
  const pct = n ? Math.round(ok / n * 100) : 0;
  if (R.scope !== "fejl") { S.bedst[R.scope] = Math.max(S.bedst[R.scope] || 0, pct); save(S); }

  const byText = {};
  for (const l of R.log) {
    const t = textOf(l.q), k = l.q.kursus + " · " + t.label;
    byText[k] = byText[k] || {ok:0, n:0}; byText[k].n++; if (l.ok) byText[k].ok++;
  }
  const rows = Object.entries(byText).sort((a,b) => a[1].ok/a[1].n - b[1].ok/b[1].n)
    .map(([k,v]) => $("div", {class:"row spread", style:"padding:4px 0;flex-wrap:nowrap"}, $("span", {class:"grow"}, k), $("span", {class:"chip"}, v.ok + "/" + v.n)));
  const missed = R.log.filter(l => !l.ok);

  screen(
    $("h1", {}, "Resultat"),
    $("div", {class:"card", style:"text-align:center"},
      $("div", {class:"big"}, pct + "%"),
      $("div", {class:"sub"}, ok + " af " + n + " rigtige")),
    $("div", {class:"card"}, $("h2", {style:"margin-bottom:8px"}, "Per tekst"), rows),
    missed.length ? $("div", {class:"card"}, $("h2", {style:"margin-bottom:4px"}, "Gennemgå fejl"),
      missed.map(l => $("div", {class:"miss"},
        $("div", {style:"font-weight:600"}, l.q.tekst),
        l.q.type === "mc" ? $("div", {class:"your"}, "Dit svar: " + l.chosen) : null,
        $("div", {class:"right"}, l.q.type === "mc" ? "Rigtigt: " + l.q.muligheder[l.q.rigtig] : "Se modelsvaret igen under ‘Øv mine fejl’")))) : null
  );
  setFoot(
    $("button", {class:"btn ghost", onclick: home}, "Forside"),
    missed.length ? $("button", {class:"btn", onclick(){ start(missed.map(l => l.q), "fejl", true); }}, "Tag fejlene igen") : null);
}

document.addEventListener("keydown", e => { if (R && R.key && !e.metaKey && !e.ctrlKey) R.key(e); });
home();
</script>
</body>
