<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16141c">
<title>Quiz · uge 4</title>
<style>
:root{--bg:#16141c;--card:#211e2b;--card2:#2a2636;--line:#363046;--txt:#ece9f3;--dim:#a39dba;--acc:#8b6cef;--acc2:#a78bfa;--ok:#3fb67d;--bad:#e5566b;--okbg:rgba(63,182,125,.15);--badbg:rgba(229,86,107,.15)}
@media (prefers-color-scheme:light){:root{--bg:#f6f5fa;--card:#fff;--card2:#f1eff8;--line:#e0dcee;--txt:#1d1a26;--dim:#6b6680;--acc2:#6d4fd8;--okbg:rgba(63,182,125,.13);--badbg:rgba(229,86,107,.11)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:1.45rem;margin:.2em 0 .1em}
h2{font-size:1.1rem;margin:0}
.sub{color:var(--dim);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qhead{display:flex;gap:8px;align-items:flex-start}
.qhead .row{flex:1;min-width:0}
.grow{flex:1;min-width:0}
.spread{justify-content:space-between}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:13px 18px;font-weight:600;width:100%;font-size:1rem}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 10px;border-radius:8px;background:none;font-size:.9rem;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.chip{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.chip.unread{border-color:#b7892f;color:#e0b04f}
.chip.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.arg{border-color:var(--acc);color:var(--acc2);font-weight:600}
.texts{margin:10px 0 12px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.texts div{display:flex;gap:6px;align-items:center}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.q{font-size:1.12rem;font-weight:600;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 14px 48px;margin:10px 0;position:relative;line-height:1.35}
.opt::before{content:attr(data-k);position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:50%;background:var(--card2);color:var(--dim);font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok::before{content:"✓";background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad::before{content:"✕";background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.expl{scroll-margin-bottom:130px;background:var(--card2);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:.95rem}
.expl b{color:var(--acc2)}
.answer{white-space:pre-wrap}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.big{font-size:3rem;font-weight:800;margin:.1em 0}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss:first-child{border-top:0}
.miss .your{color:var(--bad);font-size:.9rem}
.miss .right{color:var(--ok);font-size:.9rem}
.link{background:none;color:var(--dim);text-decoration:underline;font-size:.85rem;padding:6px}
.x{background:none;color:var(--dim);font-size:1.4rem;padding:0 4px;line-height:1}
label.tog{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--dim)}
label.tog input{width:18px;height:18px;accent-color:var(--acc)}
</style>
</head>

<script>
const QUIZ = {"id": "2026E-uge04-v2", "titel": "Quiz · uge 4", "undertitel": "Session 4 · 21.–25. september 2026 · DAK3, EP, PA", "semester": "2026E", "uge": 4, "kurser": [{"kode": "DAK3", "navn": "Kolonisering og Mellemøsten", "tekster": [{"id": "hariri", "label": "Hariri 2015", "kort": "Hariri 2015 - Muslim and Middle Eastern Exceptionalism", "læst": true}, {"id": "herb", "label": "Herb 1999", "kort": "Herb 1999 - All in the Family", "læst": true}, {"id": "lange", "label": "Lange 2009 (slides + anmeldelse)", "kort": "Lange 2009 - Lineages of Despotism and Development", "læst": false}, {"id": "slides", "label": "Forelæsning F04"}], "spørgsmål": [{"type": "mc", "kategori": "argument", "kilde": "hariri", "side": "s. 477–478", "tekst": "Hvad er Hariris overordnede argument?", "muligheder": ["Underskuddet er ikke exceptionelt: tidlig statsdannelse gav lidt bosættelse og indirekte styre, som hæmmede demokrati", "Underskuddet er exceptionelt, fordi islam historisk har været uforenelig med repræsentative og demokratiske institutioner", "Underskuddet skyldes olieindtægterne, som har gjort lederne uafhængige af skatteydernes krav om indflydelse", "Underskuddet skyldes Sykes-Picots arbitrære grænser, som skabte varige etniske og religiøse spændinger"], "rigtig": 0, "forklaring": "Gåde: MENA og den muslimske verden er markant mindre demokratiske, og ingen teori kan forklare hvorfor. Påstand: Underskuddet kan indordnes under en generel historisk dynamik. Mekanisme: Tidlige stater holdt europæerne ude og blev styret indirekte, så europæiske institutioner og idéer spredtes kun i begrænset omfang. Belæg: Når lande med samme førkoloniale statsudvikling og bosættelse sammenlignes, forsvinder MENA- og muslim-dummyerne.", "id": "DAK3-01"}, {"type": "mc", "kategori": "argument", "kilde": "hariri", "side": "s. 478–480; slides s. 34", "tekst": "Hvilken kausalkæde ligger bag Hariris argument?", "muligheder": ["Tidlig statsdannelse → lidt bosættelse og indirekte styre → ringe spredning af europæiske institutioner → autokrati", "Kolonisering → udvinding af naturressourcer → rentierstat uden skattebase → ledere uden ansvarlighed → autokrati", "Islam → svagt civilsamfund og lav kvindelig deltagelse → stagnerende modernisering → vedvarende autokrati", "Europæisk bosættelse → undertrykkelse af oprindelige folk → etniske konflikter og borgerkrig → autokrati"], "rigtig": 0, "forklaring": "Trin 1: Førkolonial statsudvikling afgjorde, om og hvordan et område blev koloniseret (A1, B1). Trin 2: Koloniseringens mønster afgjorde regimeudviklingen (A2, B2). Dertil kommer en direkte effekt: Tidlig statsdannelse gjorde det også lettere at kontrollere intern opposition og legitimerede traditionelle eliter.", "id": "DAK3-02"}, {"type": "mc", "kategori": "argument", "kilde": "hariri", "side": "s. 478; slides s. 33, 60", "tekst": "Hvordan forholder Hariris argument sig til forklaringer som Bellins (repressiv kapacitet) eller islamisk doktrin?", "muligheder": ["Han afviser dem ikke, men viser, at de ikke har hæmmet demokrati mere end i lande med samme historie", "Han afviser dem som empirisk forkerte og erstatter dem med sin egen rent historiske og strukturelle forklaring", "Han mener, at de forklarer underskuddet bedre end hans eget argument om statsdannelse", "Han ignorerer dem, fordi de ikke kan måles i store tværnationale analyser"], "rigtig": 0, "forklaring": "En vigtig nuance til eksamen: Hariri forklarer ikke, hvorfor demokrati ikke opstod endogent i regionen. Hans pointe er, at uanset om det var repressiv kapacitet, religion eller noget andet, har det ikke været en større hindring end i lande med lige så tidlig statsdannelse og lige så begrænset europæisk indflydelse. Derfor er underskuddet ikke exceptionelt.", "id": "DAK3-03"}, {"type": "mc", "kategori": "begreb", "kilde": "hariri", "side": "s. 477; slides s. 48", "tekst": "Hvad betyder ‘exceptionalisme’ i debatten om Mellemøsten og demokrati?", "muligheder": ["At underskuddet består, selv når man kontrollerer for de kendte forklaringer på demokrati", "At Mellemøsten simpelthen har færre demokratier end nogen anden region i hele verden i dag", "At Mellemøstens stater har usædvanligt stærke hære og sikkerhedsapparater", "At Mellemøsten som eneste region aldrig er blevet koloniseret af europæerne"], "rigtig": 0, "forklaring": "Exceptionalisme betyder, at underskuddet ‘unddrager sig’ de eksisterende teoriers forklaringskraft: MENA- eller muslim-dummyen forbliver negativ og signifikant efter kontrol for teoriernes variable. Hariri bekræfter det først (Tabel 1) og viser derefter, at underskuddet forsvinder, når der kontrolleres for historien.", "id": "DAK3-04"}, {"type": "mc", "kategori": "teori", "kilde": "hariri", "side": "s. 482–484; slides s. 49–54", "tekst": "Hvilke forklaringer tester Hariri først, og hvad er resultatet?", "muligheder": ["Repressiv kapacitet, modernisering, olie og kunstige grænser – ingen af dem fjerner underskuddet", "Repressiv kapacitet, modernisering, olie og kunstige grænser – hver af dem fjerner underskuddet", "Islam, kultur og politiske værdier – tilsammen forklarer de underskuddet fuldt ud", "Kolonimagt, bosættelse og indirekte styre – ingen af dem har nogen betydning"], "rigtig": 0, "forklaring": "Bellins repressive kapacitet, Lipset og Kuran (modernisering), ressourceforbandelsen og Sykes-Picot og heterogenitet efterlader alle et stort, signifikant underskud. Set fra disse teoriers perspektiv ser regionen altså exceptionel ud. Hariris pointe er, at historien er den udeladte variabel.", "id": "DAK3-05"}, {"type": "mc", "kategori": "teori", "kilde": "hariri", "side": "s. 479–480, 485", "tekst": "Hvordan spredte europæisk bosættelse ifølge Hariri tidlige demokratiske institutioner?", "muligheder": ["Bosætterne tog institutioner og idéer med og krævede de samme rettigheder som landsmændene hjemme", "Kolonimagterne var demokratier og eksporterede bevidst deres forfatninger til kolonierne", "Bosætterne gav de oprindelige folk stemmeret for at sikre deres loyalitet over for kolonien", "Bosættelse skabte økonomisk vækst, og væksten førte automatisk til demokrati, som Lipset forudsagde"], "rigtig": 0, "forklaring": "Ingen af kolonimagterne var demokratier. Men bosætterne var i ‘communication and communion’ med hjemlandet, så oplysningsidéer spredtes bredt i samfundet, og de eksperimenterede med repræsentativ regering ved uafhængigheden. Sammenhængen mellem bosættelse og demokrati holder også, når der kontrolleres for modernisering, så det er ikke bare Lipsets mekanisme.", "id": "DAK3-06"}, {"type": "mc", "kategori": "teori", "kilde": "hariri", "side": "s. 480; slides s. 23–24, 57–58", "tekst": "Mellemøsten mødte europæisk indflydelse gennem ‘defensiv modernisering’. Hvorfor gav den ikke samme demokratiske effekt som bosættelse?", "muligheder": ["Reformerne var top-down og selektive, sigtede mod en effektiv stat og nåede kun en snæver elite", "Reformerne blev påtvunget af kolonimagterne mod befolkningens vilje og derfor afvist", "Reformerne kopierede kun Europas økonomiske institutioner og ikke dets militær og bureaukrati", "Reformerne var så radikale, at de straks udløste borgerkrig og statssammenbrud i regionen"], "rigtig": 0, "forklaring": "Tanzimat og lignende reformer skulle styrke staten (hær og bureaukrati), ikke begrænse den: ‘the most important aim of the Tanzimat was autocracy and centralization’. Nye institutioner blev lagt oven på de traditionelle, og idéerne nåede kun ‘the French knowers’. I bosætterkolonierne gennemsyrede idéerne derimod hele samfundet.", "id": "DAK3-07"}, {"type": "mc", "kategori": "kritik", "kilde": "hariri", "side": "s. 487–488", "tekst": "Hvad viser Tyrkiet og Algeriet om rækkevidden af Hariris argument?", "muligheder": ["At europæisk bosættelse hverken er en nødvendig (Tyrkiet) eller tilstrækkelig (Algeriet) betingelse for demokrati", "At europæisk bosættelse er både en nødvendig og en tilstrækkelig betingelse for demokrati i regionen", "At argumentet kun gælder for de tidligere britiske kolonier og ikke for franske, spanske eller tidligere osmanniske områder", "At førkolonial statsudvikling ingen betydning har i Mellemøsten, kun i Afrika og Latinamerika"], "rigtig": 0, "forklaring": "Tyrkiet blev mere demokratisk end forventet uden bosættelse, fordi Atatürk afskaffede de traditionelle institutioner i stedet for at supplere dem. I Algeriet var der bosættelse, men rettighederne var forbeholdt bosætterne, og de rejste ved uafhængigheden. Argumentet handler om probabilistiske tendenser, ikke deterministiske betingelser.", "id": "DAK3-08"}, {"type": "åben", "kategori": "argument", "kilde": "hariri", "side": "s. 477–490", "tekst": "Gengiv Hariris hovedargument, som du ville gøre det til eksamen: gåde, påstand, mekanisme, belæg og bidrag.", "svar": "Gåde: Mellemøsten og den muslimske verden har et markant demokratisk underskud, som består efter kontrol for modernisering, olie, repressiv kapacitet og kunstige grænser. Derfor kaldes det ‘exceptionelt’.\n\nPåstand: Underskuddet er ikke exceptionelt. Det kan indordnes under en generel historisk dynamik, ‘the autocratic legacy of early statehood’.\n\nMekanisme: (1) Områder med udviklede førkoloniale stater kunne modstå kolonisering og fik mindre europæisk bosættelse. Blev de koloniseret, blev de styret indirekte gennem eksisterende hierarkier. (2) Bosættelse spredte europæiske institutioner og idéer, mens indirekte styre fastfrøs traditionelle, autoritære strukturer. Tidlig statsdannelse gjorde det desuden lettere at kontrollere intern opposition.\n\nBelæg: 2SLS-analyser af ikke-europæiske lande. Når førkolonial statsudvikling (instrumenteret) og bosættelse kontrolleres, er MENA- og muslim-dummyerne ikke længere signifikante.\n\nBidrag: I Europa fremmede statsdannelse parlamenter, uden for Europa hæmmede den demokrati. Artiklen viser desuden, at historie kan være en udeladt variabel i tværnationale analyser. Nuance: Den forklarer ikke, hvorfor demokrati ikke opstod endogent.", "id": "DAK3-09"}, {"type": "mc", "kategori": "argument", "kilde": "herb", "side": "s. 2–4", "tekst": "Hvad er Herbs overordnede argument om de mellemøstlige monarkiers overlevelse?", "muligheder": ["Monarkier overlever, når kongefamilien selv behersker staten som herskende institution (dynastisk monarki)", "Monarkier overlever, når olieindtægterne gør det muligt at købe befolkningens loyalitet med velfærd", "Monarkier overlever, når hæren rekrutteres blandt loyale beduinstammer frem for bybefolkningen", "Monarkier overlever, når de tidligt åbner parlamenter og deler magten med den voksende uddannede middelklasse"], "rigtig": 0, "forklaring": "Gåde: Hvorfor har otte monarkier overlevet i en region og en tid, der er fjendtlig over for monarkier? Påstand: Nøglen er familiens rolle i regimet. Hvor familien monopoliserer de tunge poster og har mekanismer til at fordele magten internt, er regimet ‘extremely hard to overthrow’. Intet dynastisk monarki er faldet til revolution, mens alle monarkier, der udelukkede familien fra regeringen, er faldet.", "id": "DAK3-10"}, {"type": "mc", "kategori": "argument", "kilde": "herb", "side": "s. 1–2, 13", "tekst": "Hvilken gåde tager Herb udgangspunkt i?", "muligheder": ["At otte mellemøstlige monarkier har overlevet trods forudsigelser om deres snarlige fald", "At monarkierne i Mellemøsten er langt mere demokratiske end regionens republikker", "At de olierige monarkier faldt, mens de fattige monarkier alle overlevede revolutionerne", "At republikkerne overlevede Det Arabiske Forår, mens næsten alle monarkier faldt"], "rigtig": 0, "forklaring": "Huntington og andre forudsagde monarkiernes undergang. Gåden skærpes af, at de to mest oplagte forklaringer, olie og uddannelse, ikke kan forklare mønstret: Olierige monarkier som Iran, Irak og Libyen faldt, og de overlevende har flere studerende end de faldne havde.", "id": "DAK3-11"}, {"type": "mc", "kategori": "begreb", "kilde": "herb", "side": "s. 8–9", "tekst": "Hvad kendetegner et ‘dynastisk monarki’ hos Herb?", "muligheder": ["Familien monopoliserer ministerierne for inden-, uden- og forsvarsanliggender samt premierministerposten", "Monarken regerer alene og vælger frit sine ministre blandt loyale embedsmænd, hofmænd og hærens officerer", "Tronen går altid til den ældste søn efter en fast, forfatningsbestemt arvefølge", "Monarken deler magten med et folkevalgt parlament, der udpeger regeringen"], "rigtig": 0, "forklaring": "De såkaldte ‘ministries of sovereignty’. Familiemedlemmer sidder også spredt ud i statsapparatet. Kontrasten er monarkier, hvor kongen selv vælger sine løjtnanter (som shahen): Han har mere personlig magt, men regimet er mindre stabilt (Montesquieu).", "id": "DAK3-12"}, {"type": "mc", "kategori": "teori", "kilde": "herb", "side": "s. 9–10", "tekst": "Hvilken mekanisme gør ifølge Herb dynastiske monarkier så modstandsdygtige?", "muligheder": ["Arvefølgen afgøres ved familiekonsensus, og resten af familien bandwagoner i stedet for at splitte sig", "En uafhængig forfatningsdomstol afgør arvefølgen, og alle familiegrene respekterer dens afgørelser", "Kongen udpeger sin efterfølger alene, så der aldrig opstår strid om tronen i familien", "Familien holdes sammen af gensidig hengivenhed og et fravær af konkurrence om posterne"], "rigtig": 0, "forklaring": "Paradokset: Det er netop prinsernes selvinteresserede konkurrence om magt, der skabte og fastholder dynastiets greb om staten. Slægtninge på nøgleposter kræver deres poster bekræftet for at støtte en ny hersker, og dem, der ikke selv er kandidater, bandwagoner, så familien ikke splittes. Plato: Revolution begynder med splid i den herskende klasse.", "id": "DAK3-13"}, {"type": "mc", "kategori": "teori", "kilde": "herb", "side": "s. 10–13", "tekst": "Hvilke to udbredte forklaringer afviser Herb som utilstrækkelige?", "muligheder": ["Rentierstatsteorien og teorien om den nye uddannede middelklasse", "Bargaining-modellen og teorien om tidlig europæisk statsdannelse", "Teorierne om kulturel exceptionalisme og frygten for politisk islam", "Teorierne om kolonialt indirekte styre og de arbitrære grænser"], "rigtig": 0, "forklaring": "Rentierteorien siger, at rentierstater bliver autoritære, men ikke hvordan eller hvilke der overlever. Olierige monarkier som Iran, Irak og Libyen faldt. Huntington og Halpern forventede, at den uddannede middelklasse ville vælte kongerne, men de overlevende monarkier har flere studerende end de faldne havde. At begge forklaringer fejler, er netop det, der gør gåden interessant.", "id": "DAK3-14"}, {"type": "mc", "kategori": "teori", "kilde": "herb", "side": "s. 10–11", "tekst": "Hvordan nyfortolker Herb ressourceforbandelsen?", "muligheder": ["Olie virker gennem de eksisterende institutioner: indtægterne lod familierne erobre den voksende stat", "Olie virker direkte: jo større olieindtægter, jo mere stabilt bliver ethvert autoritært regime", "Olie virker destabiliserende, fordi den skaber en uddannet middelklasse, der kræver politisk deltagelse", "Olie virker kun gennem hæren, fordi olieindtægterne finansierer loyale beduinrekrutter"], "rigtig": 0, "forklaring": "Det afgørende er ikke olien i sig selv, men hvordan aktørerne reagerede på olieindtægterne inden for de eksisterende institutioner. Olien fik statsapparatet til at vokse lynhurtigt, og herskerens slægtninge stod klar til at besætte de nye poster (Kuwait 1938). Derfor findes dynastisk monarki i fuldt udviklet form kun i oliestater. Men hvor olien fandtes uden dynastisk monarki, faldt monarkiet.", "id": "DAK3-15"}, {"type": "mc", "kategori": "begreb", "kilde": "herb", "side": "s. 14", "tekst": "Hvad er ‘the King's dilemma’ (Huntington), som Herb mener, monarkier kan undslippe?", "muligheder": ["Reformer er nødvendige for at undgå revolution, men giver oppositionen en platform til at vælte ham", "Han må vælge mellem at dele magten med sin egen udvidede familie eller med de ambitiøse officerer i hæren", "Han må vælge mellem olieindtægter og skatter som statens vigtigste finansieringskilde", "Han må vælge mellem en alliance med Vesten og solidaritet med de arabiske nabolande"], "rigtig": 0, "forklaring": "Ifølge Huntington vil den nye middelklasse kapre partier og parlament og bruge dem mod monarken, så den eneste vej til stabilitet er lukket. Burke kaldte Generalstænderne i 1789 ‘the medicine of the state corrupted into its poison’. Herb mener, at monarkier kan undslippe dilemmaet, fordi de kan liberalisere i små skridt.", "id": "DAK3-16"}, {"type": "mc", "kategori": "teori", "kilde": "herb", "side": "s. 15–16", "tekst": "Hvorfor egner monarkier sig ifølge Herb bedre end andre autokratier til gradvis liberalisering?", "muligheder": ["En monark kan holde valg og stadig være monark", "Monarker har større oliereserver og kan derfor købe oppositionen fri", "Monarkier har ingen stærk hær, så oppositionen frygter ikke kup", "Monarkers magt var allerede begrænset af parlamenter fra kolonitiden"], "rigtig": 0, "forklaring": "Andre autokrater mister legitimiteten, hvis de taber et valg. En monark skal blot undgå et flertal af ‘fire-breathing antiroyalists’. Magten kan så forhandles i små, forudsigelige skridt mellem palads og parlament. Det er den monarkiske vej mod demokrati, som nogle europæiske stater gik: reform frem for revolution (Karl & Schmitter).", "id": "DAK3-17"}, {"type": "mc", "kategori": "begreb", "kilde": "herb", "side": "s. 15", "tekst": "Hvorfor er neopatrimoniale (sultanistiske) regimer som shahens Iran særligt sårbare for revolution?", "muligheder": ["Reform underminerer det patron-klient-netværk, de hviler på, og eliten mangler regler til at vælge en afløser", "De er afhængige af olieindtægter, og et fald i olieprisen fører straks til statsbankerot, nedskæringer og folkeligt oprør", "De har stærke parlamenter, som oppositionen kan bruge som platform til at afsætte herskeren", "De styres af en stor kongefamilie, der uundgåeligt splittes i kampen om tronfølgen"], "rigtig": 0, "forklaring": "Herskeren organiserer regimet omkring sig selv, og eliten er afhængig af hans personlige gunst. Under revolutionært pres undertrykker han frem for at reformere, og når han går af eller dør, kollapser regimet, fordi eliten mangler den sammenhængskraft, som institutioner giver. Det er den modsatte type af Herbs dynastiske monarki.", "id": "DAK3-18"}, {"type": "mc", "kategori": "teori", "kilde": "herb", "side": "s. 8 (Tabel 1.1)", "tekst": "Hvordan er Herbs typologi af mellemøstlige monarkier bygget op?", "muligheder": ["Efter familiens rolle i regeringen: monopol, tilladt uden monopol, eller forbudt", "Efter olierigdom: rentierstater over for monarkier uden væsentlige olieindtægter", "Efter kolonihistorie: britiske, franske og aldrig koloniserede monarkier", "Efter legitimitetsgrundlag: religiøs, traditionel eller revolutionær legitimitet"], "rigtig": 0, "forklaring": "Dynastiske monarkier (Saudi-Arabien, Kuwait, Qatar, Bahrain, UAE) har ingen revolution haft. Monarkier, hvor familien må sidde i regeringen uden at dominere den (Jordan, Marokko, Oman), har overlevet. Monarkier, der forbød familien i regeringen (Egypten, Irak, Libyen, Iran, Afghanistan), er alle faldet. Typologien er selve argumentets empiriske kerne.", "id": "DAK3-19"}, {"type": "mc", "kategori": "kritik", "kilde": "herb", "side": "s. 4, 7–10; diskussionsark", "tekst": "Autokrater skal håndtere to trusler: masserne, de hersker over, og eliten, de hersker med. Hvilken løser dynastisk monarki primært?", "muligheder": ["Truslen fra eliten – gennem magtdeling og regler for arvefølgen", "Truslen fra masserne – gennem velfærdsgoder og undertrykkelse", "Truslen fra udlandet – gennem alliancer med Vesten og USA", "Truslen fra økonomiske kriser – gennem oliefonde og opsparing"], "rigtig": 0, "forklaring": "Herbs argument handler først og fremmest om intra-elitekonflikt: En herskende klasse, der kan regulere sine egne konflikter, er næsten umulig at vælte. Masserne håndteres mere indirekte gennem familiernes mange kontakter i samfundet og muligheden for gradvis liberalisering. Det kan bruges til at forstå monarkiernes overlevelse under Det Arabiske Forår, men Jordan og Marokko er ikke dynastiske.", "id": "DAK3-20"}, {"type": "åben", "kategori": "argument", "kilde": "herb", "side": "s. 1–19", "tekst": "Gengiv Herbs hovedargument, som du ville gøre det til eksamen: gåde, påstand, mekanisme, belæg og implikationer.", "svar": "Gåde: Monarkier blev spået en ‘bleak’ fremtid, men otte mellemøstlige monarkier har overlevet til slutningen af det 20. århundrede.\n\nPåstand: Overlevelsen forklares af familiens rolle i regimet. I dynastiske monarkier monopoliserer kongefamilien de tunge poster og fungerer som en herskende institution.\n\nMekanisme: Arvefølgen afgøres ved familiekonsensus. Slægtninge på nøgleposter forhandler om magten, og ikke-kandidater bandwagoner, så familien ikke splittes. Olieindtægterne gjorde det muligt for familierne at erobre de hurtigt voksende petrostater (Kuwait 1938). En herskende klasse, der kan regulere sine interne konflikter, kontrollerer en moderne stat og har støtte i samfundet, er næsten umulig at vælte.\n\nBelæg: Sammenligning af 8 overlevende og 5 faldne monarkier (Tabel 1.1). Alternative forklaringer testes og afvises: rentier (Iran, Irak og Libyen var olierige og faldt) og uddannelse (de overlevende har flere studerende).\n\nImplikationer: Monarkier kan liberalisere gradvist, fordi en monark kan holde valg og forblive monark. Det er en mulig vej til konstitutionelt monarki, der undslipper Huntingtons King's dilemma. Generelt: Alle autokratier skal løse problemet med intern magtfordeling og arvefølge.", "id": "DAK3-21"}, {"type": "åben", "kategori": "teori", "kilde": "herb", "side": "s. 10–11; diskussionsark", "tekst": "Herb tilbyder en ‘lille nyfortolkning’ af ressourceforbandelsen. Forklar den.", "svar": "Den klassiske rentierteori siger, at olie gør lederne uafhængige af skatteyderne og dermed autoritære. Herb påpeger, at teorien siger, at rentierstater bliver autoritære, men ikke hvordan, og at den ikke forklarer, hvem der overlever: Iran, Irak og Libyen var olierige og faldt.\n\nHans pointe er, at olie virker gennem de eksisterende institutioner. Olieindtægterne fik statsapparatet og regeringerne til at vokse lynhurtigt, og i Golfen stod herskerens slægtninge klar til at besætte de nye poster. Olien muliggjorde altså det dynastiske monarki, og det er det dynastiske monarki, ikke olien i sig selv, der giver stabilitet.", "id": "DAK3-22"}, {"type": "mc", "kategori": "argument", "kilde": "lange", "side": "anmeldelse s. 1940–41; slides s. 8–15", "tekst": "Hvad er Langes overordnede argument?", "muligheder": ["Det er kolonistyrets form – direkte eller indirekte – der gennem den efterladte stat afgør udviklingen", "Det er selve koloniseringen, der afgør udviklingen: koloniserede lande klarer sig dårligere end andre", "Britisk kolonisering var generelt gavnlig for udviklingen, fordi briterne indførte common law overalt", "Kolonisering skadede udviklingen, fordi kolonimagterne systematisk udvandt kolonierne for ressourcer"], "rigtig": 0, "forklaring": "Lange flytter debatten fra om kolonialisme var godt eller skidt til, hvilken form den havde. Direkte styre efterlod inkluderende, bureaukratiske stater med høj infrastrukturel magt, der kunne gennemføre udviklingspolitik. Indirekte styre efterlod personaliserede, ekskluderende stater med ‘despotic and predatory’ embedsmænd. Formen påvirkede både økonomisk udvikling og demokratisering.", "id": "DAK3-23"}, {"type": "mc", "kategori": "teori", "kilde": "lange", "side": "anmeldelse s. 1941; slides s. 12–15", "tekst": "Via hvilken mekanisme påvirker kolonistyrets form ifølge Lange udviklingen?", "muligheder": ["Gennem den stat, det efterlod: bureaukratisk og inkluderende eller personaliseret og ekskluderende", "Gennem de grænser, det trak: direkte styre gav naturlige grænser, indirekte styre arbitrære grænser", "Gennem de afgrøder, det indførte: direkte styre gav plantager, indirekte styre gav selvforsyning", "Gennem den religion, det spredte: direkte styre gav kristendom, indirekte styre bevarede islam"], "rigtig": 0, "forklaring": "Staten er den mellemliggende variabel: ‘states determine development, and the type of state varies according to strategies of colonial rule’. Under direkte styre var staten lokalt til stede og tilgængelig, en bureaukratisk ‘kravlegård’. Under indirekte styre blev staten todelt, og lokale høvdinge blev despoter.", "id": "DAK3-24"}, {"type": "mc", "kategori": "begreb", "kilde": "lange", "side": "slides s. 8–9", "tekst": "Hvilken definition hører til indirekte styre hos Lange?", "muligheder": ["‘Domination via collaborative relations between a colonial center and regionally based indigenous institutions’", "‘A complete system of colonial domination in which local and central institutions are well integrated’", "‘A formalized chain of command linking every provincial administration uniformly to the central state’", "‘Rule through salaried bureaucrats applying one uniform metropolitan legal code across the whole territory’"], "rigtig": 0, "forklaring": "De tre andre citater beskriver direkte styre: en territoriel udvidelse af staten med formelt bureaukrati, lønnede embedsmænd og en ensartet kommandovej, hvor lokale og centrale institutioner følger samme principper.", "id": "DAK3-25"}, {"type": "mc", "kategori": "begreb", "kilde": "lange", "side": "anmeldelse s. 1941", "tekst": "Direkte styre gav ifølge Lange stater med høj ‘infrastrukturel magt’. Hvad betyder det?", "muligheder": ["Statens evne til faktisk at trænge ind i samfundet og gennemføre politik i hele territoriet", "Statens magt til at træffe beslutninger uden at skulle forhandle med nogen af samfundets grupper", "Mængden af veje, jernbaner og havne, som kolonimagten nåede at bygge i kolonien", "Statens militære slagkraft over for nabolandene og mulige oprørsbevægelser"], "rigtig": 0, "forklaring": "Begrebet stammer fra Michael Mann: infrastrukturel magt (at kunne gennemføre beslutninger gennem samfundet) over for despotisk magt (at kunne beslutte uden at forhandle med samfundet). Stater efter indirekte styre kan godt være despotiske, men har lav infrastrukturel magt. Det er netop dét, der hæmmer udviklingen.", "id": "DAK3-26"}, {"type": "mc", "kategori": "teori", "kilde": "slides", "side": "s. 10–11 (Gerring et al.)", "tekst": "Hvornår bliver en koloni mest sandsynligt styret indirekte (Gerring et al.)?", "muligheder": ["Når der findes en hierarkisk, statslignende struktur at delegere til", "Når mange bosættere fra metropolen udvandrer og slår sig ned i kolonien", "Når befolkningen er organiseret i egalitære stammer uden centrale ledere", "Når kolonien ligger tæt på metropolen og er let at kontrollere militært"], "rigtig": 0, "forklaring": "Indirekte styre kræver stabile, pålidelige myndighedsstrukturer at delegere til. Uden dem må kolonimagten selv projicere autoritet med eget politi, militær og bureaukrati. Det kræver bosættere, der forventer samme institutioner som hjemme, og resultatet er direkte styre. Samme logik er trin 1 hos Hariri.", "id": "DAK3-27"}, {"type": "mc", "kategori": "begreb", "kilde": "slides", "side": "s. 13–15", "tekst": "Hvad dækker Mamdanis begreb ‘decentraliseret despoti’?", "muligheder": ["Høvdinge blev kun ansvarlige opad over for kolonimagten og kunne regere som lokale despoter", "Magten blev spredt på mange konkurrerende høvdinge, hvilket skabte en form for lokalt demokrati", "De uafhængige stater decentraliserede magten og mistede kontrollen med periferien", "Direkte styre skabte et stærkt, men undertrykkende centralbureaukrati i hovedstaden"], "rigtig": 0, "forklaring": "Indirekte styre afskar ansvarligheden nedad. Lesotho-eksemplet: Med britisk beskyttelse behøvede høvdingene ikke længere frygte angreb, holdt op med at konsultere folket, og folkeforsamlingen (pitso) døde ud. Indirekte styre er desuden konserverende, fordi det fastfryser magtstrukturer, og skaber en todelt stat.", "id": "DAK3-28"}, {"type": "mc", "kategori": "kritik", "kilde": "lange", "side": "anmeldelse s. 1941–42", "tekst": "Hvad er Julian Gos centrale indvending mod Langes argument?", "muligheder": ["At han insisterer på kolonistyret som eneste faktor, selvom fx ressourceafhængighed også kan forklare", "At han kun ser på økonomisk udvikling og helt overser demokratisering i de tidligere kolonier", "At han mangler kvalitative casestudier og udelukkende bygger sit argument på regressioner", "At han sammenligner britiske og franske kolonier uden at kontrollere for, hvem kolonimagten egentlig var"], "rigtig": 0, "forklaring": "Go peger på to problemer: (1) Udvælgelsen, hvor ca. 28 kolonier udelukkes af hensyn til ‘homogenitet’, selvom teorien siger, at formen virker uanset andre forskelle. Det tyder på uudtalte scope conditions. (2) Sierra Leone var diamantrig, så ressourceforbandelsen er en mulig alternativ eller supplerende forklaring. Lange indrømmer til sidst, at formen ikke er ‘the only factor’.", "id": "DAK3-29"}, {"type": "mc", "kategori": "teori", "kilde": "lange", "side": "slides s. 8–15, 34", "tekst": "Hvordan hænger Langes og Hariris argumenter sammen?", "muligheder": ["Begge ser indirekte styre som skadeligt; Hariri tilføjer, at det selv var et resultat af tidlig statsdannelse", "Lange mener, at indirekte styre fremmede både demokrati og udvikling, mens Hariri mener, at det hæmmede demokrati", "Hariri afviser betydningen af kolonistyrets form og ser udelukkende på bosættelsens omfang", "De har intet overlap, fordi Lange studerer økonomisk udvikling og Hariri kun demokrati"], "rigtig": 0, "forklaring": "Lange tager formen for kolonistyre som udgangspunkt og forklarer dens konsekvenser gennem staten. Hariri går et skridt længere tilbage: Formen var selv endogen, fordi områder med udviklede førkoloniale stater oftere blev styret indirekte. Hariri bruger endda Langes mål for indirekte styre (andelen af sager ved sædvaneretlige domstole).", "id": "DAK3-30"}, {"type": "åben", "kategori": "argument", "kilde": "lange", "side": "slides s. 8–15; anmeldelse", "tekst": "Gengiv Langes hovedargument og forklar, hvorfor direkte styre gav bedre udviklingsbetingelser end indirekte styre.", "svar": "Påstand: Det er ikke tilstedeværelsen af kolonialisme, men kolonistyrets form, der afgør den postkoloniale udvikling, både økonomisk og politisk.\n\nMekanisme: Staten. Direkte styre skabte et relativt stærkt, sammenhængende og meritokratisk (weberiansk) bureaukrati, der styrede ensartet i hele territoriet. Staten var lokalt til stede og tilgængelig for indbyggerne som borgere og ansatte. Det gav inkluderende stater med høj infrastrukturel magt, der kunne gennemføre udviklingspolitik. Indirekte styre gav personaliserede, ekskluderende stater med lav infrastrukturel magt. Høvdingene blev kun ansvarlige opad (decentraliseret despoti), magtstrukturerne blev fastfrosset, og staten blev todelt. Resultatet var ‘developmental bads’.\n\nBelæg: Nested design: regression på britiske kolonier med andelen af sædvaneretlige retssager som mål for indirekte styre, plus casestudier (Mauritius mod Sierra Leone, Botswana og Guyana som afvigende cases).\n\nKritik (Go): Udvælgelsen af cases og at alternative forklaringer som ressourceafhængighed underspilles.", "id": "DAK3-31"}, {"type": "mc", "kategori": "begreb", "kilde": "slides", "side": "s. 23–24", "tekst": "Hvad er ‘defensiv modernisering’?", "muligheder": ["Statsstyrede reformer efter europæisk forbillede for at holde trit med Vesten – især hær og bureaukrati", "Reformer, som kolonimagterne påtvang kolonierne for at forsvare dem mod rivaliserende imperier", "Befolkningernes oprør mod europæisk modernisering for at forsvare de traditionelle religiøse institutioner", "Moderniseringsteoriens påstand om, at økonomisk vækst beskytter nye demokratier mod sammenbrud"], "rigtig": 0, "forklaring": "‘Defensiv’, fordi formålet var at holde sig ajour med Vesten, og ‘modernisering’, fordi målet var en moderne stat med moderne bureaukrati og hær. Eksempler er Muhammed Ali i Egypten, Tanzimat, Meiji-Japan, Atatürk og Reza Shah. Pointen i forhold til Hariri er, at det var modernisering af staten, ikke af forholdet mellem stat og borgere.", "id": "DAK3-32"}, {"type": "mc", "kategori": "begreb", "kilde": "slides", "side": "s. 29–30", "tekst": "Hvad betyder ‘suffocation’ i Englebert et al.'s analyse af koloniale grænser?", "muligheder": ["At forskellige nationer eller grupper blev tvunget sammen i samme politiske enhed", "At én nation eller etnisk gruppe blev delt af de nye grænser mellem flere stater i regionen", "At kolonimagten spillede grupperne ud mod hinanden for at bevare kontrollen", "At nye stater lukkede grænserne og kvalte handlen med nabolandene"], "rigtig": 0, "forklaring": "Suffocation betyder at blive presset sammen, som i Irak, der blev skabt af provinserne Baghdad, Basra og Mosul. Dismemberment betyder at blive delt. Begge øger heterogeniteten, hvilket normalt hæmmer demokrati. Men hos Hariri forklarer grænsekunstighed ikke MENA-underskuddet.", "id": "DAK3-33"}, {"type": "mc", "kategori": "teori", "kilde": "slides", "side": "s. 49–52", "tekst": "Hvordan forklarer argumentet om ‘frygten for politisk islam’ (Lust-Okar) manglen på demokrati i Mellemøsten?", "muligheder": ["Islamistiske bevægelser skræmmer den sekulære opposition og Vesten, så oppositionen svækkes", "Islam indeholder et antidemokratisk element, som gør befolkningerne skeptiske over for demokrati", "Staterne har usædvanligt stærke sikkerhedsapparater og en vilje til at slå oppositionen ned", "Islamisk arveret hæmmede kapitalakkumulation og dermed den økonomiske modernisering"], "rigtig": 0, "forklaring": "‘If we press for elections, we might not get the chance again’: Sekulære grupper og Vesten foretrækker ‘the devil they know’. I modsætning til Bellins argument om repressiv kapacitet er det oppositionens svaghed, ikke statens styrke, der forklarer manglen på reform. Det antidemokratiske kulturelement er Huntingtons argument, sikkerhedsapparatet Bellins og arveretten Kurans.", "id": "DAK3-34"}, {"type": "mc", "kategori": "teori", "kilde": "slides", "side": "s. 51", "tekst": "Hvad er ressourceforbandelsens kernemekanisme for politisk udvikling?", "muligheder": ["Staten finansieres af ressourceindtægter frem for skatter, så lederne ikke står til ansvar over for borgerne", "Naturressourcer tiltrækker udenlandske invasioner, som ødelægger de demokratiske institutioner", "Ressourcerne skaber en stor industriarbejderklasse, som organiserer sig i revolutionære partier og fagforeninger", "Ressourcerige lande bliver hurtigt så rige, at befolkningen mister interessen for politik"], "rigtig": 0, "forklaring": "Samme logik forklarer den økonomiske forbandelse: Lederne har ingen incitament til at føre udviklingspolitik. Dertil kommer Dutch disease: Olieeksport presser valutakursen op og skader anden eksport, ofte fremstillingsindustri, hvilket også skubber kvindejobs ud. Herb nyfortolker mekanismen: Det afgørende er, hvem der erobrer den oliefinansierede stat.", "id": "DAK3-35"}, {"type": "mc", "kategori": "argument", "kilde": "slides", "side": "s. 65–69 (Nunn 2008)", "tekst": "Hvad er Nunns argument om slavehandlens langsigtede effekter i Afrika?", "muligheder": ["Områder med stor slaveeksport er i dag fattigere, bl.a. via etnisk fragmentering og mistillid", "Slavehandlen havde ingen langsigtede effekter, fordi den sluttede før koloniseringen begyndte", "Områder med stor slaveeksport er i dag rigere, fordi de tidligt blev integreret i verdenshandlen", "Slavehandlen forklarer demokratiske forskelle i Afrika, men ikke de økonomiske forskelle"], "rigtig": 0, "forklaring": "Mennesker blev taget af folk fra samme eller lignende etniske grupper, hvilket førte til politisk og etnisk fragmentering, mistillid og en ‘gun-slave cycle’. Nunn tager højde for, at de mindst udviklede områder måske blev ramt hårdest (endogenitet), ved at bruge afstanden til de havne, der importerede slaver, som instrument.", "id": "DAK3-36"}, {"type": "åben", "kategori": "teori", "kilde": "hariri", "side": "Hariri + Herb", "tekst": "Sammenlign Hariri og Herb: Hvordan forklarer de hver især autokrati i Mellemøsten, og kan deres argumenter forenes?", "svar": "Hariri forklarer niveauet af demokrati i regionen som helhed med en langsigtet, strukturel og historisk forklaring: Tidlig statsdannelse gav lidt europæisk bosættelse og indirekte styre, som fastfrøs autoritære strukturer. Det er en makro- og tværnational forklaring.\n\nHerb forklarer variationen inden for regionen, dvs. hvorfor nogle monarkier overlever og andre falder. Det er en institutionel og aktørbaseret forklaring (rationelle aktører, der søger magt): Dynastisk monarki løser elitens interne konflikter om magt og arvefølge.\n\nForening: De besvarer forskellige spørgsmål, og Hariri henviser selv til Herb. Monarkierne ligger tættere på Hariris regressionslinje end republikkerne, og Golfmonarkierne var britiske instrumenter for indirekte styre. Begge ser traditionelle autoritetsstrukturer som centrale. Spænding: Herb mener, at monarkier kan være en vej til gradvis demokratisering, mens Hariri ser den traditionelle arv som en hindring.", "id": "DAK3-37"}]}, {"kode": "EP", "navn": "Integration, disintegration og kriser", "tekster": [{"id": "hm09", "label": "Hooghe & Marks 2009", "kort": "Hooghe 2009 - A Postfunctionalist Theory of European Integration", "læst": false}, {"id": "hm19", "label": "Hooghe & Marks 2019", "kort": "Hooghe 2019 - Grand Theories of European Integration in the Twenty-First Century", "læst": false}, {"id": "jones", "label": "Jones et al. 2021", "kort": "Jones 2021 - Failing Forward", "læst": false}, {"id": "slides", "label": "Forelæsning F04"}], "spørgsmål": [{"type": "mc", "kilde": "hm09", "side": "s. 1–2", "tekst": "Hvilke tre ‘irreducible logics’ former ifølge Hooghe & Marks præferencer for den jurisdiktionelle arkitektur?", "muligheder": ["Effektivitet, distribution og identitet", "Effektivitet, legitimitet og suverænitet", "Spillover, supranational aktivisme og læring", "Interesser, institutioner og idéer"], "rigtig": 0, "forklaring": "Neofunktionalisme og LI ser præferencer som økonomiske (effektivitet og distribution). Postfunktionalismens bidrag er identitet. Styring er både et middel til kollektive goder og et udtryk for fællesskab, og borgerne bekymrer sig ‘passionately’ om, hvem der udøver autoritet over dem.", "kategori": "begreb", "id": "EP-01"}, {"type": "mc", "kilde": "hm09", "side": "s. 5–6, 21", "tekst": "Hvad markerer overgangen fra ‘permissive consensus’ til ‘constraining dissensus’?", "muligheder": ["Maastricht-traktaten (1991–92) og det danske nej", "De første direkte valg til Europa-Parlamentet i 1979", "De Gaulles tomme stols-krise i 1965–66", "Østudvidelsen med ti nye medlemsstater i 2004"], "rigtig": 0, "forklaring": "Frem til omkring 1991 kunne isolerede eliter indgå aftaler, mens befolkningen var passiv. Siden har partilederne i regering måttet ‘look over their shoulders’. De direkte valg fra 1979 ændrede ifølge H&M ikke det elitecentrerede billede, fordi europavalg blot var popularitetstests for de nationale regeringer.", "kategori": "begreb", "id": "EP-02"}, {"type": "mc", "kilde": "hm09", "side": "s. 2", "tekst": "Hvorfor kaldes teorien ‘post’-funktionalistisk?", "muligheder": ["Den er agnostisk over for, om de jurisdiktioner, der skabes, er effektive", "Den mener, at funktionelt pres er holdt helt op med at spille en rolle", "Den er udviklet efter den kolde krig og afløser neofunktionalismen helt", "Den antager, at integrationen altid ender i et funktionelt optimalt føderalt system"], "rigtig": 0, "forklaring": "Ligesom NF og LI ser H&M et mismatch mellem effektivitet og den eksisterende autoritetsstruktur som det, der sætter integrationen i gang. Men de antager ikke, at udfaldet afspejler det funktionelle pres. ‘Political conflict makes all the difference.’", "kategori": "teori", "id": "EP-03"}, {"type": "mc", "kilde": "hm09", "side": "s. 8–9", "tekst": "Hvad afgør ifølge H&M's model (Figur 2), om konflikten om et EU-spørgsmål præges af identitet eller distribution?", "muligheder": ["Hvilken arena spørgsmålet afgøres i – massepolitik eller interessegrupper", "Om spørgsmålet vedrører ‘high politics’ (suverænitet) eller ‘low politics’", "Om det er Kommissionen eller Rådet, der har initiativretten på området", "Hvor stor den økonomiske gevinst ved integration er for medlemsstaterne"], "rigtig": 0, "forklaring": "Modellen har fem trin: (1) reform impetus (mismatch), (2) issue creation, (3) arena rules, fx regler om folkeafstemninger, (4) arena choice, som partierne står for, og (5) konfliktstruktur. Arenaen er både afhængig og uafhængig variabel.", "kategori": "teori", "id": "EP-04"}, {"type": "mc", "kilde": "hm09", "side": "s. 8–9, 13", "tekst": "Hvad er ifølge H&M det afgørende, der har ændret sig siden 1985?", "muligheder": ["Beslutningerne er rykket fra en isoleret elite til massepolitik", "Befolkningens støtte til EU-medlemskab er styrtdykket siden 1985", "Eliterne er i dag blevet mere EU-skeptiske end befolkningen", "Interessegrupperne har overtaget beslutningerne fra partierne"], "rigtig": 0, "forklaring": "Nettostøtten i 2005 er ikke meget lavere end i 1985 (Fig. 3). ‘Even if preferences have not changed much, the game has.’ Eliterne er stadig langt mere pro-EU end befolkningen: Kløften var fx 54 % i Tyskland og 57 % i Sverige i 1996.", "kategori": "argument", "id": "EP-05"}, {"type": "mc", "kilde": "hm09", "side": "s. 12–13", "tekst": "Hvornår fører en stærk national identitet til EU-skepsis ifølge H&M?", "muligheder": ["Når den er eksklusiv og aktiveres (‘cued’) af partier", "Altid – jo stærkere national tilknytning, jo mere EU-skepsis", "Kun når personen også er økonomisk taber på det indre marked", "Aldrig – identitet påvirker kun eliter, ikke befolkningen"], "rigtig": 0, "forklaring": "Man kan godt have en stærk national tilknytning og være positiv over for EU. Det afgørende er, om identiteten er eksklusiv eller inkluderende. De Vries og Edwards viser, at jo stærkere det populistiske højre er, jo mere EU-skeptiske bliver personer med eksklusiv identitet. Personer med inkluderende identitet påvirkes ikke.", "kategori": "teori", "id": "EP-06"}, {"type": "mc", "kilde": "hm09", "side": "s. 13", "tekst": "Hvad er ‘framing’ i H&M's beskrivelse af, hvordan EU-holdninger konstrueres?", "muligheder": ["At forbinde en bestemt overvejelse med et politisk objekt", "At gøre en bestemt overvejelse fremtrædende (salient)", "At indpode en bias gennem signaler fra et parti eller en leder", "At flytte en beslutning fra interessegruppearenaen til massearenaen"], "rigtig": 0, "forklaring": "Priming er at gøre en overvejelse salient, framing er at forbinde den med et politisk objekt, og cueing er at indpode en bias. Holdninger til EU er særligt modtagelige for konstruktion, fordi EU er et fjernt, abstrakt og nyt objekt.", "kategori": "begreb", "id": "EP-07"}, {"type": "mc", "kilde": "hm09", "side": "s. 16–17", "tekst": "Hvilken dimension viste sig at forklare partiernes EU-holdninger bedst i H&M's ekspertsurvey?", "muligheder": ["GAL/TAN-dimensionen (kulturel/identitetsmæssig)", "Den økonomiske venstre-højre-dimension (stat mod marked)", "Center-periferi-dimensionen fra Lipset & Rokkan", "By-land-dimensionen (landbrug mod industri)"], "rigtig": 0, "forklaring": "H&M forventede, at venstre-højre ville dominere, men GAL/TAN overskyggede den. De mener, at sammenhængen går gennem national identitet. TAN-partier som Front National og FPÖ afviser integration af samme grund som immigration: begge underminerer det nationale fællesskab.", "kategori": "begreb", "id": "EP-08"}, {"type": "mc", "kilde": "hm09", "side": "s. 18", "tekst": "Hvorfor er partikonflikten om EU simplere og mere polariseret i Central- og Østeuropa?", "muligheder": ["GAL/TAN og venstre/højre forstærker hinanden i stedet for at krydse", "Der findes ingen egentlige TAN-partier i de postkommunistiske lande", "Alle partierne dér er enige om at støtte EU-medlemskab uden forbehold", "Venstre/højre-dimensionen forsvandt helt efter kommunismens fald"], "rigtig": 0, "forklaring": "I Vesteuropa kommer EU-skepsis fra to forskellige partityper, TAN-partierne og den radikale venstrefløj. I øst er de to kilder smeltet sammen: Venstrepartier har tendens til at være TAN, og TAN-partier har tendens til at være venstreorienterede.", "kategori": "teori", "id": "EP-09"}, {"type": "mc", "kilde": "hm09", "side": "s. 19–21", "tekst": "Hvilke overvejelser styrer ifølge H&M, om partiledere vil politisere EU-spørgsmålet?", "muligheder": ["Vælgerpotentiale, ideologisk omdømme og risikoen for at splitte partiet", "Kommissionens dagsorden, Domstolens praksis og Rådets afstemningsregler", "Landets BNP, nettobidraget til EU-budgettet og handelsbalancen", "Interessegruppernes pres, mediernes dækning og Eurobarometer-målinger"], "rigtig": 0, "forklaring": "Mainstreampartierne har holdt sig fra spørgsmålet, fordi det går på tværs af venstre-højre og splitter dem (fx de britiske konservative). Derfor er debatten formet af EU's modstandere: populistiske TAN-partier, nationalister i de konservative partier og den radikale venstrefløj.", "kategori": "teori", "id": "EP-10"}, {"type": "mc", "kilde": "hm09", "side": "s. 13", "tekst": "Hvilken af følgende er IKKE en af H&M's betingelser for, at identitet bliver kausalt vigtig for et spørgsmål?", "muligheder": ["Spørgsmålet har gennemsigtige økonomiske konsekvenser for vælgerne", "Spørgsmålet har gennemsigtige konsekvenser for fællesskabet", "Spørgsmålet debatteres i offentlige fora", "Spørgsmålet drives af masseorganisationer frem for specialiserede interessegrupper"], "rigtig": 0, "forklaring": "Betingelserne er (a) uigennemsigtige økonomiske implikationer, (b) gennemsigtige implikationer for fællesskabet, (c) debat i offentlige fora og (d) masseorganisationer frem for specialiserede grupper. Når de økonomiske konsekvenser er tydelige, fylder distribution mere.", "kategori": "teori", "id": "EP-11"}, {"type": "mc", "kilde": "hm09", "side": "s. 22", "tekst": "Hvordan forudser H&M, at politiske ledere vil reagere på politiseringen?", "muligheder": ["De vil bruge mindre reformpakker, opt-outs og ikke-majoritære agenturer", "De vil holde flere folkeafstemninger for at genvinde den tabte legitimitet", "De vil opgive traktatændringer helt og lade EU stagnere permanent", "De vil lade Europa-Parlamentet vedtage traktatændringer uden medlemsstaterne"], "rigtig": 0, "forklaring": "H&M mener ikke, at politiseringen kan ‘stuffes tilbage i posen’. I stedet vil den stimulere beslutningsreformer, der sænker temperaturen, bl.a. ved at undgå folkeafstemninger.", "kategori": "teori", "id": "EP-12"}, {"type": "mc", "kilde": "hm19", "side": "s. 1115", "tekst": "Hvilken mikrofundering og kausallogik har neofunktionalismen ifølge Hooghe & Marks (2019)?", "muligheder": ["Begrænset rationalitet og stiafhængighed med sunk costs", "Fuldt rationelle stater, der forhandler ud fra relativ magt og asymmetri", "Politisk psykologi, hvor identitet vejer tungere end økonomisk interesse", "Normer og idéer, der socialiserer eliter til en fælles europæisk identitet"], "rigtig": 0, "forklaring": "Fuldt rationelle stater og asymmetrisk afhængighed er LI, og identitet over interesser er postfunktionalismen. Tidligere integration skaber uforudsete kriser, og sunk costs gør det svært at vende om. NF forventer en takket, men opadgående kurve.", "kategori": "teori", "id": "EP-13"}, {"type": "mc", "kilde": "hm19", "side": "s. 1122–1124", "tekst": "Hvilken teori har ifølge H&M størst forklaringskraft for Brexit – og hvordan ser LI på Brexit?", "muligheder": ["Postfunktionalismen; LI kalder Brexit ‘illusorisk’", "Neofunktionalismen; LI ser Brexit som starten på EU's opløsning", "LI; postfunktionalismen ser Brexit som et rent økonomisk valg", "Neofunktionalismen; PF kan ikke forklare folkeafstemningen"], "rigtig": 0, "forklaring": "PF forklarer beslutningen om at holde afstemningen (Cameron ville stoppe UKIP), en debat hvor siderne aldrig mødtes (økonomi mod selvbestemmelse), og at immigration blev afgørende. NF og LI fremhæver den økonomiske gensidige afhængighed, der taler imod et hårdt Brexit.", "kategori": "teori", "id": "EP-14"}, {"type": "mc", "kilde": "hm19", "side": "s. 1120–1122", "tekst": "Hvordan forklarer LI udfaldet af migrationskrisen 2015–16?", "muligheder": ["De mindst berørte stater kunne blokere, uden at det kostede dem noget", "Transnational finans pressede på for dybere integration for at redde Schengen", "Kommissionen fik gennemført sin fordelingsnøgle for 160.000 flygtninge", "Nationale identiteter blev overvundet af en fælles europæisk solidaritet"], "rigtig": 0, "forklaring": "Til forskel fra eurokrisen var der ingen eksistentiel trussel. Selv en suspension af Schengen ville ikke vælte økonomien, og kun menneskerettighedsgrupper pressede på. Resultatet blev den laveste fællesnævner. NF forklarer derimod den gradvise styrkelse af Frontex, og PF forklarer den identitetspolitiske polarisering.", "kategori": "teori", "id": "EP-15"}, {"type": "mc", "kilde": "hm19", "side": "s. 1118–1120", "tekst": "Hvordan forklarer neofunktionalismen eurokrisen?", "muligheder": ["Som utilsigtet spillover fra en ‘halvbagt’ ØMU, der endte i mere supranationalisme", "Som adskilte mellemstatslige forhandlinger, hvor de nordlige lande dikterede vilkårene", "Som resultatet af nationalistiske partiers pres, der lammede de nationale regeringer", "Som et eksogent chok fra USA uden nogen varig effekt på EU's institutioner"], "rigtig": 0, "forklaring": "ØMU fjernede den monetære fleksibilitet uden en forsikring mod asymmetriske chok. Stiafhængighed betød, at euroen blev reddet frem for at blive opgivet, med bankunion, ECB's ‘whatever it takes’ og mere makroøkonomisk koordinering til følge. De nordlige landes dominans i forhandlingerne er LI's forklaring, nationalistisk lammelse er PF's.", "kategori": "teori", "id": "EP-16"}, {"type": "mc", "kilde": "hm19", "side": "s. 1117", "tekst": "Hvad adskiller postfunktionalismen fra NF og LI, når det gælder mulige udfald?", "muligheder": ["Kun PF ser disintegration som et muligt udfald", "Kun PF forventer, at integrationen altid bevæger sig fremad over tid", "Kun PF mener, at resultatet typisk bliver den laveste fællesnævner", "Kun PF tillader, at integrationen kan gå i stå i længere perioder"], "rigtig": 0, "forklaring": "NF og LI ser integration som samarbejde, hvor divergerende præferencer i værste fald giver deadlock (status quo). PF ser en kulturel kløft som ved den nationale statsdannelse, og derfor kan udfaldet også være disintegration.", "kategori": "teori", "id": "EP-17"}, {"type": "mc", "kilde": "jones", "side": "s. 1519–1521", "tekst": "Hvad beskriver ‘failing forward’-mønsteret?", "muligheder": ["Ufuldstændige aftaler sår kimen til kriser, der driver videre integration", "EU fejler så ofte, at medlemsstaterne gradvist trækker kompetencer tilbage", "Supranationale aktører udnytter hver krise til komplette føderale løsninger", "Kriser får befolkningerne til at kræve integration, som eliterne modvilligt leverer"], "rigtig": 0, "forklaring": "Gåden fra eurokrisen var, at lederne vedtog minimale nødløsninger, selvom mange vidste, at de var uholdbare. Alligevel bevægede løsningerne over tid EU mod dybere integration.", "kategori": "argument", "id": "EP-18"}, {"type": "mc", "kilde": "jones", "side": "s. 1521", "tekst": "Hvordan kombinerer failing forward-rammen de store integrationsteorier?", "muligheder": ["LI forklarer de kortsigtede forhandlinger, NF den langsigtede uddybning", "NF forklarer de kortsigtede forhandlinger, LI den langsigtede uddybning", "Postfunktionalismen forklarer kriserne, LI forklarer løsningerne", "Begge afvises til fordel for en ny konstruktivistisk tilgang"], "rigtig": 0, "forklaring": "Teorierne ses normalt som gensidigt udelukkende, men her virker de i tandem, på forskellige tidspunkter og i forskelligt tempo.", "kategori": "argument", "id": "EP-19"}, {"type": "mc", "kilde": "jones", "side": "s. 1525", "tekst": "Hvilke tre scope conditions gør failing forward mere sandsynligt?", "muligheder": ["Kriseintensitet, EU-kompetence og omkostningen ved at gå tilbage", "Folkelig støtte, Tysklands position og hvem der er kommissionsformand", "Enstemmighed i Rådet, flertal i Parlamentet og ECB's mandat", "Økonomisk vækst, lav arbejdsløshed og stabile regeringer"], "rigtig": 0, "forklaring": "Jones et al. understreger, at failing forward ikke er den eneste måde, integration sker på. Monnets ‘Europe will be forged in crises’ er eksplicit ikke deres argument.", "kategori": "teori", "id": "EP-20"}, {"type": "mc", "kilde": "jones", "side": "s. 1526", "tekst": "Hvilke egenskaber skal en krise have for at udløse failing forward?", "muligheder": ["Omfattende, ukendt og eksistentiel", "Kortvarig, lokal og forudsigelig", "Eksogen, økonomisk og symmetrisk", "Mediebåren, politiseret og folkeafstemningsudløst"], "rigtig": 0, "forklaring": "Finanskrisen og COVID-19 havde alle tre egenskaber. Retsstatskrisen, Brexit og ustabile nabolande kan være lige så alvorlige, men de er ‘slower burning’ og lettere at bagatellisere retorisk.", "kategori": "begreb", "id": "EP-21"}, {"type": "mc", "kilde": "jones", "side": "s. 1527–1530", "tekst": "Hvor på kompetencespektret forventer Jones et al. oftest at se failing forward?", "muligheder": ["I midten, hvor kompetencen er delt (fx ØMU)", "Hvor EU har eksklusiv kompetence (fx handel og konkurrence)", "Hvor EU slet ingen kompetence har (fx forsvar og sikkerhed)", "Der er ingen sammenhæng mellem kompetence og failing forward"], "rigtig": 0, "forklaring": "Uden kompetence har de supranationale aktører ingen løftestang (CSDP, naboskabspolitikken), og med eksklusiv kompetence er der få muligheder for at uddybe. I midten kan fejl tilskrives ufuldstændige EU-institutioner, og Kommissionen kan sætte dagsordenen, som med SURE-programmet under pandemien.", "kategori": "teori", "id": "EP-22"}, {"type": "mc", "kilde": "jones", "side": "s. 1523–1524", "tekst": "Hvad mener Jones et al. med ‘forward’?", "muligheder": ["Dybere integration – men hverken teleologisk eller normativt ment", "At EU bevæger sig mod en føderal stat, som er hele processens endelige mål", "At politikken bliver bedre og mere effektiv efter hver krise", "At EU optager nye medlemsstater i kølvandet på hver krise"], "rigtig": 0, "forklaring": "‘Just because Europe is moving forward does not mean it is getting better.’ Forward kan også betyde udvidelse, og det kan gå hånd i hånd med decentral håndhævelse, som i konkurrencepolitikken.", "kategori": "begreb", "id": "EP-23"}, {"type": "mc", "kilde": "jones", "side": "s. 1531–1532", "tekst": "Hvorfor ‘failed EU to fail forward’ i retsstatskrisen ifølge Emmons & Pavone?", "muligheder": ["Modstandere brugte ‘rhetorics of inaction’ til at undskylde passivitet", "Krisen var så intens, at EU i stedet valgte fuld føderalisering af retsområdet", "EU havde eksklusiv kompetence og behøvede derfor ikke at handle", "Omkostningen ved at gå tilbage var så høj, at ingen turde handle"], "rigtig": 0, "forklaring": "Pointen er, at agency kan blokere dynamikken, selv når der er funktionelt pres. Kelemen sammenligner det med at indrette en toiletafdeling i et svømmebassin: problemet bliver ikke i sit hjørne.", "kategori": "kritik", "id": "EP-24"}, {"type": "mc", "kategori": "begreb", "kilde": "jones", "side": "s. 1530–1531", "tekst": "Hvad dækker ‘omkostningen ved at gå tilbage’ (lock-in) som betingelse for failing forward?", "muligheder": ["Jo dyrere det er at afvikle en EU-ordning, jo mere sandsynligt giver man den mere autoritet i en krise", "Jo dyrere en krise er for medlemsstaterne, jo mere sandsynligt afvikler de de fælles EU-ordninger", "Jo flere medlemsstater der deltager i en ordning, jo lettere er det at vende tilbage til national politik", "Jo større EU's budget er på et område, jo mindre sandsynligt er det, at der overhovedet opstår kriser"], "rigtig": 0, "forklaring": "Som bilisten, der er strandet midt i krydset: Jo sværere det er at bakke, jo mere sandsynligt flygter man fremad. Institutioner med store faste omkostninger, læringseffekter og koordineringseffekter giver lock-in (historisk institutionalisme). Eksempel: Grækenland og Cypern valgte kapitalkontrol frem for at forlade euroen. Det var lettere midlertidigt at suspendere en frihed end at afvikle monetær union.", "id": "EP-25"}, {"type": "åben", "kilde": "hm19", "side": "s. 1116–1117, 1123–1124", "tekst": "Anvend postfunktionalismens tretrinslogik (mismatch → arenavalg → konfliktstruktur) på Brexit.", "svar": "Mismatch: Økonomisk gensidig afhængighed og EU-regler (fri bevægelighed, indre marked) stødte sammen med ønsket om national selvbestemmelse.\n\nArenavalg: Cameron flyttede spørgsmålet til massearenaen med en folkeafstemning for at neutralisere UKIP og dæmpe den EU-afvisende fløj i De Konservative (arena rules gjorde det muligt).\n\nKonfliktstruktur: I massearenaen blev konflikten identitetsbaseret. Leave talte om selvbestemmelse og immigration, Remain om økonomi, og de to sider mødtes aldrig. Et binært valg gav ‘a single bit of information’ om et komplekst spørgsmål. Resultatet var ikke ‘økonomisk rationelt’, og polariseringen er siden blevet hårdere. ‘Nationalism can subvert multilevel governance.’", "kategori": "teori", "id": "EP-26"}, {"type": "åben", "kilde": "hm19", "side": "s. 1118–1120", "tekst": "Hvordan forklarer henholdsvis LI, NF og PF eurokrisen? Er forklaringerne gensidigt udelukkende?", "svar": "LI: Gentagne mellemstatslige forhandlinger præget af gensidig afhængighed og asymmetri, med Grækenland m.fl. som afhængige parter. Resultatet blev laveste-fællesnævner-aftaler, der minimerede Nordens kortsigtede omkostninger.\n\nNF: Krisen var en utilsigtet spillover fra en halvbagt ØMU. Stiafhængighed betød, at euroen blev reddet, og det gav mere supranationalisme (ECB, bankunion, makroøkonomisk overvågning).\n\nPF: Nationalistisk opposition lammede regeringerne, og finanspolitisk union var umulig. Man depolitiserede via ikke-majoritære institutioner, og svaret blev delvist, forsinket og Pareto-inferiort.\n\nH&M: Forklaringerne er komplementære, fordi de stiller forskellige spørgsmål. Jones et al. kombinerer eksplicit LI (kort sigt) og NF (lang sigt).", "kategori": "teori", "id": "EP-27"}, {"type": "åben", "kilde": "jones", "side": "s. 1524", "tekst": "Hvad kan krisedrevet integration (failing forward) betyde for EU's legitimitet?", "svar": "Nødløsninger, der sår kimen til nye problemer, kan give indtryk af, at ‘the EU is rudderless and in a perpetual state of crisis’. Jo mere EU-løsninger ser ud til at fejle eller skabe fremtidige problemer, jo hurtigere bliver permissive consensus til constraining dissensus (Hooghe & Marks). Dynamikken kan altså være selvundergravende.\n\nDet modsiges dog delvist af, at støtten til EU og euroen steg igen efter kriserne. EU's første snublen under COVID og faldende tillid til EU-Domstolen har genoplivet bekymringen.", "kategori": "kritik", "id": "EP-28"}, {"type": "åben", "kilde": "hm09", "side": "s. 18; slides s. 13", "tekst": "Nævn postfunktionalismens fire forventninger om GAL/TAN og europæisk integration.", "svar": "1) Integration forstærker en tidligere sekundær, ikke-økonomisk identitetsdimension (præ-materielle værdier om gruppetilhørsforhold).\n2) Det er dårligt nyt for mainstreampartierne, fordi dimensionen ikke kan rummes på venstre-højre-skalaen og risikerer at splitte deres vælgere.\n3) Når integrationen udvides til ikke-økonomiske områder, bliver EU-skepsis mere TAN.\n4) Politiseringen er størst i lande med populistiske TAN-partier.", "kategori": "teori", "id": "EP-29"}, {"type": "mc", "kategori": "argument", "kilde": "hm09", "side": "s. 1–2, 5, 21–23", "tekst": "Hvad er Hooghe & Marks' (2009) overordnede argument?", "muligheder": ["Politisering har gjort identitet og massepolitik afgørende, så integrationen nu begrænses af en ‘constraining dissensus’", "Integration drives af transnationale interessegrupper og spillover, som gradvist flytter loyaliteten til EU-niveauet", "Integration er resultatet af mellemstatslige forhandlinger mellem regeringer med primært økonomiske præferencer", "Integrationen er gået i stå, fordi befolkningerne er blevet markant mere EU-skeptiske siden midten af 1980'erne"], "rigtig": 0, "forklaring": "Tre påstande: (a) EU-integration er blevet politiseret i valg og folkeafstemninger. (b) Derfor er befolkningens og partiernes præferencer blevet afgørende. (c) Identitet er central for konflikten. Resultatet er et nedadgående pres på integrationens niveau og omfang. Bemærk: Pointen er ikke, at befolkningen er blevet mere skeptisk, men at beslutningerne er flyttet fra eliten til massepolitik.", "id": "EP-30"}, {"type": "mc", "kategori": "argument", "kilde": "hm09", "side": "s. 1–4", "tekst": "Hvordan adskiller postfunktionalismen sig grundlæggende fra neofunktionalismen og LI?", "muligheder": ["Præferencer er også identitetsbaserede, og konflikt i massepolitik kan bremse selv funktionelt ønskværdig integration", "Præferencer er rent økonomiske, men de formes af de politiske partier frem for af de økonomiske interessegrupper i landene", "Integration drives af supranationale aktører, men kun på de områder, hvor befolkningerne selv efterspørger det", "Integration afgøres af geopolitik og stormagtsrivalisering frem for af økonomiske eller identitetsmæssige hensyn"], "rigtig": 0, "forklaring": "NF og LI deler to antagelser: at præferencer er økonomiske og at integration handler om distributiv forhandling mellem (økonomiske) interessegrupper. De generaliserer fra de første tre årtiers ‘permissive consensus’. PF tilføjer identitet og konflikt i massepolitik: ‘Functional pressures are one thing, regime outcomes are another.’", "id": "EP-31"}, {"type": "mc", "kategori": "argument", "kilde": "hm19", "side": "s. 1113–1114, 1128", "tekst": "Hvad er Hooghe & Marks' (2019) overordnede argument?", "muligheder": ["De tre store teorier er ikke gensidigt udelukkende, men belyser hver sin side af kriserne", "Postfunktionalismen har afløst NF og LI, som ikke kan forklare det seneste årtis kriser", "LI er den eneste teori, der kan forklare både eurokrisen, migrationskrisen og Brexit", "Ingen af de tre teorier kan forklare kriserne, så der er brug for en helt ny teori"], "rigtig": 0, "forklaring": "H&M behandler NF, LI og PF som ‘skoler’, der hver giver en ‘line of sight’ ind i integrationen og stiller forskellige spørgsmål. Hver af de fire kriser (eurokrisen, migrationskrisen, Brexit og illiberalismen) er på én gang mellemstatslig forhandling, stiafhængig spillover og ideologisk konflikt. Teorierne kan og bør senere testes mod hinanden, men først skal de forstås på egne præmisser.", "id": "EP-32"}, {"type": "mc", "kategori": "teori", "kilde": "hm19", "side": "s. 1114–1117", "tekst": "Hvilke aktører og hvilken proces står centralt i de tre teorier?", "muligheder": ["NF: supranationale og transnationale aktører; LI: nationale regeringer; PF: partier og vælgere i massepolitik", "NF: nationale regeringer og domstole; LI: Kommissionen og Parlamentet; PF: interessegrupper og lobbyister", "NF: partier og vælgere i massepolitik; LI: transnationale virksomheder; PF: nationale regeringer i Rådet", "Alle tre teorier ser nationale regeringer som de eneste afgørende aktører i integrationsprocessen"], "rigtig": 0, "forklaring": "NF: spillover og supranational aktivisme, stiafhængighed og begrænset rationalitet. LI: national præferencedannelse (drevet af økonomiske interesser), mellemstatslig forhandling præget af asymmetrisk afhængighed, og institutioner, der sikrer aftalerne. PF: mismatch, arenavalg og konfliktstruktur (GAL/TAN), hvor politisering og identitet kan bremse integrationen eller føre til disintegration.", "id": "EP-33"}, {"type": "åben", "kategori": "argument", "kilde": "hm09", "side": "s. 1–23", "tekst": "Gengiv Hooghe & Marks' (2009) postfunktionalistiske hovedargument, som du ville gøre det til eksamen.", "svar": "Gåde: NF og LI kan ikke forklare det seneste årtis udvikling med folkeafstemninger, EU-skepsis, populistisk pres og EU i national partikonkurrence.\n\nPåstand: Præferencer for jurisdiktionel arkitektur følger tre logikker: effektivitet, distribution og identitet. Siden Maastricht er integrationen blevet politiseret, så befolkningens og partiernes præferencer er afgørende, og identitet er central. ‘Permissive consensus’ er afløst af ‘constraining dissensus’.\n\nModel: (1) mismatch mellem funktionelt pres og autoritetsstruktur, (2) issue creation, (3) arena rules, (4) arenavalg (partierne), (5) konfliktstruktur. Interessegruppearenaen giver distributiv konflikt (venstre/højre), massearenaen giver identitetskonflikt (GAL/TAN).\n\nIdentitet: Eksklusiv national identitet giver EU-skepsis, når den ‘cues’ af partier, især populistiske TAN-partier. Identitet er ikke givet, men konstrueres via priming, framing og cueing.\n\nPartier: Mainstreampartier undgår emnet, fordi det splitter dem. Debatten er derfor formet af TAN-partier og den radikale venstrefløj.\n\nKonsekvens: nedadgående pres på integrationens niveau og omfang. Lederne svarer med mindre reformpakker, opt-outs, differentiering og ikke-majoritære agenturer.", "id": "EP-34"}, {"type": "åben", "kategori": "argument", "kilde": "hm19", "side": "s. 1113–1128", "tekst": "Gengiv Hooghe & Marks' (2019) hovedargument og illustrér det med én af de fire kriser.", "svar": "Påstand: NF, LI og PF er ‘skoler’ snarere end falsificerbare grand theories. De er ikke gensidigt udelukkende, men giver hver sin ‘line of sight’ med forskellige gåder, aktører og mekanismer.\n\nNF: Integration drives af spillover og supranational aktivisme. Stiafhængighed og sunk costs gør tilbagerulning dyr, og kurven er takket, men opadgående.\nLI: Nationale regeringer forhandler ud fra økonomiske præferencer. Asymmetrisk afhængighed afgør udfaldet, typisk den laveste fællesnævner.\nPF: Politisering og identitet i massepolitik kan bremse integrationen, og disintegration er et muligt udfald.\n\nEksempel, migrationskrisen: LI forklarer, hvorfor en aftale om at dele ansvaret var umulig (de mindst berørte stater kunne blokere uden omkostning). NF forklarer den gradvise styrkelse af Schengen og Frontex, båret af sunk costs og Kommissionens initiativ. PF forklarer, hvordan krisen intensiverede den kulturelle kløft og styrkede de nationalistiske partier.", "id": "EP-35"}, {"type": "åben", "kategori": "argument", "kilde": "jones", "side": "s. 1519–1532", "tekst": "Gengiv Jones, Kelemen & Meuniers failing forward-argument, inkl. teorikombination og scope conditions.", "svar": "Gåde: Under eurokrisen vedtog lederne minimale nødløsninger, som de vidste var uholdbare, men over tid bevægede de EU mod dybere integration.\n\nArgument: (1) Mellemstatslig forhandling mellem stater med divergerende præferencer giver laveste-fællesnævner-løsninger og ufuldstændige institutioner (LI). (2) Ufuldstændigheden udløser neofunktionalistiske kræfter, der fører til en ny krise. (3) Staterne svarer igen med delvise løsninger, og (4) de akkumulerede løsninger lægger grunden til dybere integration (NF, spillover og supranational aktivisme). LI og NF virker altså i tandem, på forskellige tidspunkter og i forskelligt tempo.\n\n‘Forward’ betyder dybere integration og er hverken teleologisk eller normativt.\n\nScope conditions: (1) kriseintensitet (omfattende, ukendt og eksistentiel), (2) EU-kompetence (mest sandsynligt i midten, ved delt kompetence) og (3) omkostningen ved at gå tilbage (lock-in).\n\nForbehold: Failing forward er ét mønster blandt flere. EU kan ‘fail to fail forward’ (retsstatskrisen, rhetorics of inaction), og mønstret kan undergrave legitimiteten og gøre permissive consensus til constraining dissensus.", "id": "EP-36"}]}, {"kode": "PA", "navn": "Issue mobilisation", "tekster": [{"id": "berkhout", "label": "Berkhout 2013", "kort": "Berkhout 2013 - Why Interest Organizations Do What They Do", "læst": true}, {"id": "crepaz", "label": "Crepaz et al. 2022, kap. 3", "kort": "Crepaz 2022 - Viral Lobbying kap. 3 Issue Mobilisation", "læst": false}, {"id": "fraussen", "label": "Fraussen et al. 2021", "kort": "Fraussen 2021 - Why Do Interest Groups Prioritise Some Issues", "læst": false}, {"id": "stevens", "label": "Stevens 2026", "kort": "Stevens 2026 - Anticipating Nightmare Issues", "læst": false}], "spørgsmål": [{"type": "mc", "kilde": "berkhout", "side": "s. 227, 245", "tekst": "Hvilke tre ‘logics of exchange’ strukturerer Berkhouts model?", "muligheder": ["Logic of support, logic of influence og logic of reputation", "Logic of membership, logic of access og logic of voice", "Logic of collective action, logic of exit og logic of loyalty", "Logic of influence, logic of negotiation og logic of protest"], "rigtig": 0, "forklaring": "Support dækker udvekslingen med medlemmer og støtter, influence udvekslingen med beslutningstagere og reputation udvekslingen med nyhedsmedier og offentlighed. Berkhout omdøber Schmitter & Streecks ‘logic of membership’ til ‘logic of support’, så virksomheder og donationsbaserede organisationer også er dækket.", "kategori": "begreb", "id": "PA-01"}, {"type": "mc", "kilde": "berkhout", "side": "s. 228, 231", "tekst": "Hvad tilføjer Berkhout (2013) til Salisbury (1969)?", "muligheder": ["Beslutningstagere og medier – og at relationerne er gensidigt afhængige", "Lobbyisme over for parlament og ministre, som Salisbury helt overser", "Han erstatter exchange-perspektivet med ressourceafhængighedsteori", "Han overfører Salisburys teori fra USA til EU uden væsentlige ændringer"], "rigtig": 0, "forklaring": "Salisbury handler om gruppedannelse: Entreprenører investerer i goder og tilbyder dem til medlemmer for prisen ‘medlemskab’. Berkhout modsiger ham ikke, men specificerer de ekstra begrænsninger, der følger af flere samtidige udvekslingsrelationer. Studier, der kun ser på én relation, risikerer ‘underspecification’.", "kategori": "argument", "id": "PA-02"}, {"type": "mc", "kilde": "berkhout", "side": "s. 230", "tekst": "Hvordan definerer Berkhout (efter Emerson) en ressource?", "muligheder": ["En relationel evne til at belønne eller straffe en bestemt anden aktør", "Organisationens samlede budget og antallet af fuldtidsansatte i sekretariatet", "Al den information om lovgivningen, som organisationen besidder", "Medlemmernes kontingenter og donationer til organisationen"], "rigtig": 0, "forklaring": "Ressourcer er ‘not possessions or attributes of individual actors, but rather attributes of the relationship between actors’. Selve udvekslingen defineres som en interaktion, der er frivillig, gensidig og til fælles fordel.", "kategori": "begreb", "id": "PA-03"}, {"type": "mc", "kilde": "berkhout", "side": "s. 234 (Tabel 1)", "tekst": "Hvad leverer interesseorganisationen ifølge Berkhouts Tabel 1 til beslutningstagerne?", "muligheder": ["Støtternes disciplin og ‘acceptable’ policy frames", "Begivenheder (‘drama and action’) og nyhedsinput", "Organisatoriske privilegier og rettidig information om politikændringer", "Latent støtte og validering"], "rigtig": 0, "forklaring": "Til gengæld efterspørger organisationen privilegier, gunstig politik og rettidig information fra beslutningstagerne. Over for journalister leverer den events og nyhedsinput og får latent støtte, opmærksomhed og validering.", "kategori": "teori", "id": "PA-04"}, {"type": "mc", "kilde": "berkhout", "side": "s. 242–243", "tekst": "I Kollmans typologi (gengivet af Berkhout) har et spørgsmål høj popularitet i befolkningen, men lav salience. Hvilken type politik er det – og hvad gør gruppen?", "muligheder": ["‘Latent support politics’ – gruppen søger medierne for at øge saliencen", "‘Comforting politics’ – gruppen søger medierne, fordi støtten er høj", "‘Classical interest group politics’ – gruppen undgår at udvide konflikten", "‘Elitist politics’ – gruppen holder sig fra medierne og lobbyer indefra"], "rigtig": 0, "forklaring": "Høj popularitet og høj salience giver comforting politics. Lav popularitet og høj salience (for støtterne) giver klassisk interessegruppepolitik. Lav popularitet og lav salience giver elitist politics, hvor gruppen måske ‘astroturfer’ over for beslutningstagerne.", "kategori": "teori", "id": "PA-05"}, {"type": "mc", "kilde": "berkhout", "side": "s. 236–237", "tekst": "Hvad forudsiger Berkhout om ledere af organisationer i tætte (dense) interessegruppemiljøer?", "muligheder": ["Mindre kontrol over støtterne, hvis støtte også er mindre værd", "Større kontrol, fordi konkurrencen disciplinerer medlemmerne", "Lettere adgang, fordi beslutningstagere foretrækker mange små grupper", "Tætheden spiller ingen rolle for lederne i Berkhouts model"], "rigtig": 0, "forklaring": "Beslutningstagere foretrækker at udveksle med én bredt funderet organisation per sektor (neo-korporatisme). I tætte miljøer specialiserer grupperne sig i nicher efter taktik, mediekontakter og medlemsbase.", "kategori": "teori", "id": "PA-06"}, {"type": "mc", "kilde": "crepaz", "side": "s. 34, 42–46", "tekst": "Hvilke tre dimensioner af issue mobilisation undersøger Crepaz et al.?", "muligheder": ["Om, hvor hurtigt og hvor intenst de mobiliserer", "Adgang, indflydelse og synlighed i medierne", "Insider-, outsider- og koalitionsstrategier", "Medlemsrekruttering, fundraising og lobbyisme"], "rigtig": 0, "forklaring": "Issue mobilisation er ‘the decision of individual organisations to mobilise on concrete policy issues’, altså når eksisterende organisationer aktiverer deres politiske funktion. Det er noget andet end interesse- og medlemsmobilisering. De tre mål analyseres med henholdsvis logit, ordered logit og negativ binomial regression.", "kategori": "begreb", "id": "PA-07"}, {"type": "mc", "kilde": "crepaz", "side": "s. 37–40", "tekst": "Hvilken teoretiker bygger ‘affectedness’-hypotesen (H1) på?", "muligheder": ["Truman – ‘disturbances’ udløser mobilisering", "Olson – kollektive handlingsproblemer og selektive incitamenter", "Salisbury – entre
