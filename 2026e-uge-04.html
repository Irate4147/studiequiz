prenører, der tilbyder goder til medlemmer", "Schattschneider – de svage vil socialisere konflikten"], "rigtig": 0, "forklaring": "Pluralisten Truman leverer H1. Olson leverer H2 om grupptype (erhvervsinteresser løser lettere kollektive handlingsproblemer) og H3 om ressourcer via by-product-teorien.", "kategori": "teori", "id": "PA-08"}, {"type": "mc", "kilde": "crepaz", "side": "s. 48–50", "tekst": "Hvad fandt Crepaz et al. om forskellen mellem grupptyper?", "muligheder": ["Ens tilbøjelighed til at mobilisere, men NGO'er var langsommere og mindre intense", "Erhvervsgrupper var langt mere tilbøjelige end andre til overhovedet at mobilisere", "NGO'er og borgergrupper mobiliserede hurtigere, fordi de var mere berørte", "Grupptype havde ingen betydning på nogen af de tre mål for mobilisering"], "rigtig": 0, "forklaring": "Olsonske kollektive handlingsproblemer omsættes altså ikke ‘simpelt’ til issue mobilisation. Diffuse interesser mobiliserer, men ikke lige så hurtigt og vedholdende. Det er stadig en bias, men billedet er mindre dystert end hos Olson.", "kategori": "argument", "id": "PA-09"}, {"type": "mc", "kilde": "crepaz", "side": "s. 49", "tekst": "Hvordan gik det med H4 om, at interne problemer hæmmer mobiliseringen?", "muligheder": ["Ikke understøttet – overbebyrdede medlemmer gav snarere mere mobilisering", "Stærkt understøttet – interne problemer halverede mobiliseringen", "Understøttet for erhvervsgrupper, men ikke for NGO'er og borgergrupper", "Hypotesen kunne ikke testes på grund af manglende data i surveyen"], "rigtig": 0, "forklaring": "Under pandemien overlappede interne udfordringer ofte med politiske forstyrrelser. En professionsforening kunne fx skrive interne sundhedsprotokoller og samtidig lobbye om de samme regler. Effekten ligner derfor affectedness (korrelation 0,19–0,26).", "kategori": "teori", "id": "PA-10"}, {"type": "mc", "kilde": "crepaz", "side": "s. 40–41", "tekst": "Hvorfor forventede Crepaz et al. (H4), at interne problemer ville hæmme mobiliseringen, med henvisning til Berkhout og Bolleyer?", "muligheder": ["Medlemsservice og politik følger forskellige logikker, så kernen stjæler fokus", "Interne problemer får medlemmer til at melde sig ud, så gruppen mister legitimitet", "Interne problemer gør gruppen mere berørt, hvilket ifølge Truman øger mobilisering", "Interne problemer tvinger gruppen til at outsource sin lobbyisme til konsulenter"], "rigtig": 0, "forklaring": "For mange organisationer er politik en ‘by-product’. Tag en patientforening, hvis selvhjælpsmøder ikke kan flyttes online: Den bruger sin strategiske opmærksomhed på kernen. At interne problemer gør gruppen mere berørt, er i øvrigt den forklaring, der passer til det faktiske fund.", "kategori": "teori", "id": "PA-11"}, {"type": "mc", "kilde": "fraussen", "side": "s. 555", "tekst": "Hvilken af disse er IKKE én af de fem drivere for issue prioritization hos Fraussen et al.?", "muligheder": ["Mediebias", "Intern responsivitet", "Niche seeking", "Political opportunity structure"], "rigtig": 0, "forklaring": "De fem drivere er intern responsivitet, policy capacity, niche seeking, political opportunity structure (POS) og issue salience (Halpin et al. 2018). De to første er interne, de øvrige eksterne.", "kategori": "begreb", "id": "PA-12"}, {"type": "mc", "kilde": "fraussen", "side": "s. 562–563, 566–567", "tekst": "Hvad er Fraussen et al.'s overordnede fund om forholdet mellem interne og eksterne drivere?", "muligheder": ["Driverne er positivt korrelerede og ses som forenelige", "Der er en klar trade-off mellem medlemmerne og de politiske muligheder", "Eksterne drivere dominerer, og medlemmerne betyder næsten intet", "Interne drivere dominerer, og salience betyder næsten intet"], "rigtig": 0, "forklaring": "Litteraturen stiller ofte medlemsresponsivitet op mod politiske muligheder, men korrelationerne er positive (om end lave, under 0,3). Prioritering er en ‘balancing act’. Det er ikke dermed let, især ikke for insidere med en bred dagsorden.", "kategori": "argument", "id": "PA-13"}, {"type": "mc", "kilde": "fraussen", "side": "s. 564–565", "tekst": "Hvad hænger konkurrence om medlemskontingenter sammen med hos Fraussen et al.?", "muligheder": ["Mere vægt på niche seeking", "Mere vægt på issue salience", "Mindre vægt på intern responsivitet", "Mere vægt på policy capacity"], "rigtig": 0, "forklaring": "Det passer med populationsøkologien: Konkurrence om støtte fra en potentiel valgkreds får grupper til at dele policyrummet op. Adgang hænger også sammen med niche og POS, men ikke med salience, som H2 ellers forventede.", "kategori": "teori", "id": "PA-14"}, {"type": "mc", "kilde": "stevens", "side": "s. 1–2, 10", "tekst": "Hvad er et ‘nightmare issue’ hos Stevens?", "muligheder": ["En alvorlig trussel mod status quo, som endnu ikke er på den formelle dagsorden", "Ethvert lovforslag, gruppen er imod, uanset hvor langt det er i processen", "Et spørgsmål, hvor gruppen selv har fået massiv negativ dækning i de nationale medier", "Et politikområde, hvor gruppen har mistet sin indflydelse til konkurrenter"], "rigtig": 0, "forklaring": "I surveyen skal issuet være specifikt (ikke fx ‘miljø’), ikke formelt prioriteret endnu, noget gruppen vil holde af dagsordenen, og gruppens vigtigste modarbejdede sag. 485 EU-grupper angav et sådant issue.", "kategori": "begreb", "id": "PA-15"}, {"type": "mc", "kilde": "stevens", "side": "s. 4–5, 12", "tekst": "Hvad adskiller proaktiv fra reaktiv negativ agenda-setting hos Stevens?", "muligheder": ["Om gruppen handler før eller efter rivaler har rejst sagen", "Om gruppen fremmer sine egne sager eller blokerer andres", "Om gruppen bruger outside lobbying eller inside lobbying", "Om gruppen handler før vedtagelsen eller under implementeringen"], "rigtig": 0, "forklaring": "Begge former hører til Bachrach & Baratz' ‘second face of power’. Proaktiv lobbyisme fungerer som risikostyring eller forsikring. 54,4 % af grupperne svarede proaktiv.", "kategori": "begreb", "id": "PA-16"}, {"type": "mc", "kilde": "stevens", "side": "s. 5–8, 11–13", "tekst": "Hvilke tre organisatoriske faktorer styrker ifølge Stevens ‘anticipatory capacity’?", "muligheder": ["Stabsstørrelse, professionalisering og outsourcing", "Medlemstal, organisationens alder og ekspertgruppemedlemskab", "Mediedækning, koalitionsdeltagelse og folkelig opbakning", "Grupptype, krisens hastegrad og issuets kompleksitet"], "rigtig": 0, "forklaring": "Medlemstal, alder, ekspertgrupper, grupptype, krisehastegrad og kompleksitet er kontrolvariabler, og kun krisehastegraden er (svagt) signifikant. Anticipatory capacity er evnen til at forudse nightmare issues ved at opfange og fortolke svage signaler.", "kategori": "teori", "id": "PA-17"}, {"type": "mc", "kilde": "stevens", "side": "s. 5–6", "tekst": "Hvorfor ser Stevens timing primært som et spørgsmål om kapacitet frem for et strategisk valg?", "muligheder": ["Man kan ikke blokere en trussel, man ikke har opdaget i tide", "Alle grupper foretrækker at reagere for ikke at ‘vække den sovende hund’", "Timingen er fastlagt på forhånd af EU's formelle høringsprocedurer", "Proaktiv lobbyisme er ikke tilladt under EU's åbenhedsregister"], "rigtig": 0, "forklaring": "Strategiske valg som inside mod outside eller koalition mod alene forudsætter, at issuet allerede er identificeret. I positiv agenda-setting kommer initiativet fra gruppen selv. I negativ agenda-setting kræver proaktivitet, at truslen opdages tidligt.", "kategori": "argument", "id": "PA-18"}, {"type": "mc", "kilde": "stevens", "side": "s. 18–19", "tekst": "Hvad viser interaktionen mellem stabsstørrelse og professionalisering hos Stevens?", "muligheder": ["Flere ansatte øger kun proaktiviteten i professionaliserede grupper", "Flere ansatte øger proaktiviteten lige meget i alle typer grupper", "Professionalisering betyder kun noget i grupper med én ansat", "Interaktionen er insignifikant, så faktorerne virker uafhængigt"], "rigtig": 0, "forklaring": "I medlemsstyrede grupper mangler de ansatte autoritet og autonomi til at handle på tidlige signaler. Ved én ansat er forskellen (56 % mod 47 %) ikke signifikant.", "kategori": "teori", "id": "PA-19"}, {"type": "mc", "kilde": "stevens", "side": "s. 4–5", "tekst": "Hvordan adskiller Lukes' ‘third face of power’ sig fra den magt, Stevens studerer?", "muligheder": ["Det former, hvad folk overhovedet finder muligt at diskutere", "Det handler om at vinde de afgørende afstemninger i parlamentet", "Det er proaktiv lobbyisme, mens det andet ansigt er reaktiv", "Det handler om at påvirke implementering frem for dagsordenen"], "rigtig": 0, "forklaring": "Både proaktiv og reaktiv lobbyisme hører til det andet ansigt (Bachrach & Baratz): om et issue bliver prioriteret på den formelle dagsorden. Det første ansigt er de synlige beslutninger.", "kategori": "begreb", "id": "PA-20"}, {"type": "åben", "kilde": "berkhout", "side": "s. 233–243", "tekst": "Vælg en interesseorganisation, du kender (fx Danmarks Naturfredningsforening eller Landbrug & Fødevarer), og beskriv dens vigtigste ressourceudvekslinger under Berkhouts tre logikker.", "svar": "Eksempel: Danmarks Naturfredningsforening.\n\nSupport: Medlemmerne leverer kontingent, frivillig deltagelse (fx affaldsindsamlinger, som kan blive nyhedsbegivenheder) og legitimitet. DN giver dem ekspressive goder, synlighed for sagen og medlemsdemokrati (voice).\n\nInfluence: DN leverer ekspertise, acceptable policy frames og information om den folkelige opbakning (‘legislative subsidies’). Til gengæld får DN adgang (høringer, klageret) og rettidig information.\n\nReputation: DN leverer drama, begivenheder og nyhedsinput til journalister og får latent støtte, validering og issue expansion.\n\nPointen er, at relationerne hænger sammen. Mediestøtte gør det lettere at få adgang og hverve medlemmer, mens en for aggressiv outside-kampagne kan koste goodwill hos beslutningstagerne: ‘people in power do not like to sit down with rogues’.", "kategori": "teori", "id": "PA-21"}, {"type": "åben", "kilde": "crepaz", "side": "s. 50–51", "tekst": "Hvad er Crepaz et al.'s hovedfund om drivere af issue mobilisation – og hvordan kan de fortolkes normativt?", "svar": "Fund: Stærkt berørte og ressourcestærke grupper mobiliserede oftere, hurtigere og mere intenst. Grupptype betød ikke noget for om, men NGO'er og borgergrupper var langsommere og mindre intense. Interne problemer hæmmede ikke mobiliseringen.\n\nPositivt: At de mest berørte mobiliserer mest (Truman) betyder, at interessegruppesystemet efter en ‘focusing event’ hælder mod dem, der rammes hårdest, fx sundhedspersonale under COVID. Det giver bredere input og bedre informeret politik.\n\nNegativt: Ressourcer betyder meget (66 % mod 93 % mobiliserer), og ressourceulighed skaber bias tidligt i influence production-processen, fordi grupper med få ressourcer ikke når at mobilisere på nye issues. Eksempel: luftfarten over for forældre- og studentergrupper.\n\nForfatterne er samlet ‘relativt optimistiske’: 75 % mobiliserede.", "kategori": "argument", "id": "PA-22"}, {"type": "åben", "kilde": "fraussen", "side": "s. 566–568", "tekst": "Hvad er Fraussen et al.'s forklaring på interessegruppers policy-dagsordener – og er du overbevist?", "svar": "Forklaring: Grupper prioriterer ud fra fem drivere (intern responsivitet, kapacitet, niche, POS og salience), som de balancerer frem for at vælge imellem. Den relative vægt afhænger af organisatoriske træk: Generalister vægter salience og intern responsivitet, insidere vægter POS og niche, høj medlemsinvolvering giver mere intern responsivitet, og konkurrence om medlemmer giver mere niche. Citatet om detriment, sentiment, policy opportunity og organizational opportunity illustrerer det.\n\nKritikpunkter: selvrapporterede survey-svar, kun ét land (Australien), lav forklaringskraft (R² ca. 0,05–0,13), modellerne behandler driverne hver for sig, selvom interviewene viser, at de hænger sammen, uklar kausal retning (generalist → salience eller omvendt), og målingen sker på gruppeniveau frem for per issue.", "kategori": "argument", "id": "PA-23"}, {"type": "åben", "kilde": "stevens", "side": "s. 20–21", "tekst": "Hvordan kunne ‘svagere’ grupper øge deres kapacitet til at handle proaktivt på nightmare issues?", "svar": "Tag udgangspunkt i Stevens' tre faktorer:\n\n1) Ressourcer: Pool overvågningen i paraplyorganisationer eller koalitioner, og del politisk intelligence og monitoreringsværktøjer.\n2) Professionalisering: Giv de ansatte mandat til at handle på tidlige signaler uden lange medlemsprocesser, fx gennem forhåndsvedtagne positioner eller et hurtigt beslutningsorgan. Det skal afvejes mod den demokratiske legitimitet.\n3) Outsourcing: Del konsulenter, eller brug netværk af akademikere og allierede, der kan advare tidligt.\n\nDerudover kan medlemskab af ekspertgrupper give tidlig information, selvom det var insignifikant i Stevens' model. Normativt peger Stevens på, at strukturelle forskelle i anticipatory capacity bør adresseres for at sikre mangfoldighed i agenda-setting.", "kategori": "kritik", "id": "PA-24"}, {"type": "mc", "kategori": "argument", "kilde": "berkhout", "side": "s. 227–228, 243–245", "tekst": "Hvad er Berkhouts overordnede argument?", "muligheder": ["Organisationers adfærd formes af tre samtidige, indbyrdes afhængige udvekslinger med støtter, politikere og medier", "Organisationer er strategisk autonome og vælger frit den lobbystrategi, der giver mest indflydelse på politikken", "Organisationers adfærd forklares bedst af landets institutioner, fx om systemet er korporatistisk eller pluralistisk", "Organisationer opstår og overlever, når entreprenører tilbyder potentielle medlemmer attraktive selektive goder"], "rigtig": 0, "forklaring": "Interesseorganisationer er i ‘the business of managing exchange relationships between different domains’, drevet af behovet for at overleve. Hver udveksling følger sin egen logik (support, influence og reputation), og kravene modsiger ofte hinanden. Organisationerne er derfor strategisk stærkt begrænsede. Forskningsdesign bør inkludere flere relationer og begge parter i udvekslingen (‘it takes two to tango’). Den sidste mulighed er Salisburys argument.", "id": "PA-25"}, {"type": "mc", "kategori": "argument", "kilde": "crepaz", "side": "s. 46–51", "tekst": "Hvad er hovedkonklusionen i Crepaz et al.'s kapitel om issue mobilisation?", "muligheder": ["Berørte og ressourcestærke grupper mobiliserer oftere, hurtigere og mere intenst – både Truman og Olson har forklaringskraft", "Kun Olson har forklaringskraft: erhvervsgrupper dominerede fuldstændigt den politiske mobilisering under pandemien", "Kun Truman har forklaringskraft: alle berørte grupper mobiliserede lige hurtigt og lige intenst, helt uanset deres ressourcer", "Interne problemer under nedlukningen forhindrede de fleste organisationer i overhovedet at mobilisere politisk"], "rigtig": 0, "forklaring": "Affectedness (Truman, ‘disturbances’) og ressourcer (Olson, by-product) forklarer alle tre dimensioner. Grupptype giver kun en delvis bias: NGO'er mobiliserer, men langsommere og mindre intenst. Interne problemer hæmmer ikke. Normativt er billedet ambivalent: positivt, at de mest berørte bliver hørt, men problematisk, at ressourceulighed skaber bias tidligt i influence production-processen.", "id": "PA-26"}, {"type": "mc", "kategori": "argument", "kilde": "fraussen", "side": "s. 553–554, 566–567", "tekst": "Hvad er Fraussen et al.'s svar på, hvorfor interessegrupper prioriterer nogle issues frem for andre?", "muligheder": ["De balancerer fem interne og eksterne drivere, hvis relative vægt afhænger af organisatoriske træk", "De følger udelukkende medlemmernes ønsker, fordi de ellers risikerer at miste deres betalende medlemmer", "De vælger de issues, der får mest opmærksomhed i medierne og hos regeringen", "De vælger de issues, hvor sandsynligheden for en politisk sejr er størst"], "rigtig": 0, "forklaring": "Grupper kan ikke arbejde på alt, så prioritering er en ‘bottleneck of attention’. De fem drivere er intern responsivitet, kapacitet, niche, POS og salience. De er positivt korrelerede og ses som forenelige, ikke som en trade-off. Vægten varierer: Generalister vægter salience og intern responsivitet, insidere vægter POS og niche, høj medlemsinvolvering giver mere intern responsivitet, og konkurrence om medlemmer giver mere niche.", "id": "PA-27"}, {"type": "mc", "kategori": "argument", "kilde": "stevens", "side": "s. 1–3, 19–21", "tekst": "Hvad er Stevens' overordnede argument?", "muligheder": ["Kun grupper med ‘anticipatory capacity’ kan blokere nightmare issues tidligt – en ulighed i, hvem der former dagsordenen", "Grupper bør helt undlade at lobbye mod nightmare issues for ikke at ‘vække den sovende hund’ og skabe unødig offentlig opmærksomhed", "Borgergrupper lobbyer mere proaktivt end erhvervsgrupper, fordi de er tættere på offentligheden og dens bekymringer", "Timing betyder ikke noget for lobbyisme – det afgørende er kvaliteten af de argumenter, gruppen fremfører"], "rigtig": 0, "forklaring": "Negativ agenda-setting (at holde issues af dagsordenen) er et overset ‘second face of power’. Proaktiv intervention kræver, at truslen opdages tidligt, så timing er capacity-driven, ikke et taktisk valg. Anticipatory capacity styrkes af ressourcer, professionalisering og outsourcing. Normativt skaber det et ‘timing gap’: Privilegerede grupper kan gatekeepe dagsordenen i det tidligste og mest afgørende stadium.", "id": "PA-28"}, {"type": "åben", "kategori": "argument", "kilde": "berkhout", "side": "s. 227–245", "tekst": "Gengiv Berkhouts hovedargument, som du ville gøre det til eksamen.", "svar": "Spørgsmål: Hvorfor gør interesseorganisationer, som de gør?\n\nPåstand: Organisationers aktiviteter tjener til at opbygge og vedligeholde udvekslingsrelationer, drevet af incitamentet til at overleve. Organisationen er mellemled mellem tre domæner: (1) støtter/medlemmer (logic of support), (2) beslutningstagere (logic of influence) og (3) nyhedsmedier og offentlighed (logic of reputation).\n\nUdveksling: Frivillig, gensidig og til fælles fordel. Ressourcer er relationelle (evnen til at belønne eller straffe en anden aktør). Hver logik har sine udvekslede ressourcer (Tabel 1) og kontekstfaktorer som tæthed, valgkontrol over venues og mediesystem.\n\nKernepointe: Relationerne er indbyrdes afhængige og stiller modstridende krav. At gå offentligt ud kan styrke omdømmet, men skade indflydelsen. Organisationer er derfor strategisk begrænsede, ikke autonome.\n\nBidrag i forhold til Salisbury: Salisbury så kun udvekslingen mellem entreprenør og medlemmer (gruppedannelse). Berkhout tilføjer medier og beslutningstagere og bygger videre på den neo-korporatistiske logik (Schmitter & Streeck). Implikation for design: Inkludér flere relationer og begge parter i udvekslingen.", "id": "PA-29"}, {"type": "åben", "kategori": "argument", "kilde": "stevens", "side": "s. 1–21", "tekst": "Gengiv Stevens' hovedargument, som du ville gøre det til eksamen.", "svar": "Gåde: Vi ved meget om, hvordan grupper fremmer issues, men lidt om, hvordan de holder nightmare issues af dagsordenen (negativ agenda-setting), og hvorfor nogle gør det proaktivt og andre reaktivt.\n\nBegreber: Et nightmare issue er en højst konsekvensrig trussel mod status quo, som endnu ikke er på den formelle dagsorden. Proaktiv intervention sker, før rivaler har mobiliseret, reaktiv efter. Begge hører til Bachrach & Baratz' second face of power.\n\nPåstand: Timing er primært et spørgsmål om kapacitet. Anticipatory capacity, evnen til at opfange og fortolke svage signaler om kommende trusler (inspireret af anticipatory governance), er forudsætningen for proaktiv lobbyisme. Den styrkes af (H1) økonomiske ressourcer, (H2) professionalisering, hvor staben frem for medlemmerne styrer, og (H3) outsourcing til konsulenter.\n\nBelæg: En survey af 485 EU-grupper om deres vigtigste nightmare issue. Alle tre faktorer øger sandsynligheden for proaktivitet (ressourcer dog kun svagt). Flere ansatte hjælper kun i professionaliserede grupper.\n\nImplikation: Et ‘timing gap’. Privilegerede grupper kan gatekeepe dagsordenen tidligt, hvilket skævvrider repræsentationen i den tidligste fase af policyprocessen.", "id": "PA-30"}, {"type": "åben", "kategori": "teori", "kilde": "crepaz", "side": "Alle ugens tekster", "tekst": "Hvordan bidrager ugens fire tekster hver især til at forstå mobiliseringsfasen i influence production-processen?", "svar": "Berkhout (ramme): Organisationer er mellemled i tre samtidige udvekslinger (support, influence og reputation). Hvad de gør, begrænses af modstridende krav fra støtter, politikere og medier.\n\nCrepaz et al. (om og hvor meget): Issue mobilisation, altså om, hvor hurtigt og hvor intenst eksisterende organisationer bliver politisk aktive, drives af affectedness (Truman) og ressourcer (Olson). Diffuse interesser er langsommere.\n\nFraussen et al. (hvilke issues): Grupper prioriterer ved at balancere fem drivere (intern responsivitet, kapacitet, niche, POS og salience). Afvejningen afspejler Berkhouts logikker, fx intern responsivitet (support) mod POS (influence).\n\nStevens (hvornår, og negativt): Evnen til at gribe ind tidligt mod trusler afhænger af anticipatory capacity (ressourcer, professionalisering og outsourcing).\n\nFællestræk: Ressourcer og organisationsform skaber ulighed allerede i mobiliseringsfasen, før adgang og indflydelse. Det er en bias tidligt i processen, som senere faser arver.", "id": "PA-31"}]}]};

// ---------- persistence (sandboxed viewers may block storage) ----------
const KEY = "quiz:" + QUIZ.id;
let mem = {};
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return mem; } }
function save(s){ mem = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
let S = Object.assign({fejl:[], bedst:{}, antal:"10", aabne:true, fokus:"alt"}, load());
const KAT = {argument:"Hovedargument", begreb:"Begreb", teori:"Teori & model", kritik:"Kritik & vurdering"};
const FOKUS = {alt: () => true, argument: q => q.kategori === "argument", begreber: q => q.kategori === "begreb" || q.kategori === "teori"};

// ---------- helpers ----------
const $ = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const app = document.getElementById("app"), foot = document.getElementById("foot"), footin = document.getElementById("footin");
const clean = kids => kids.flat(Infinity).filter(k => k != null && k !== false);
function setFoot(...btns){ btns = clean(btns); footin.replaceChildren(...btns); foot.hidden = !btns.length; }
function screen(...kids){ app.replaceChildren(...clean(kids)); window.scrollTo(0,0); }

const ALL = [];
const TEXT = {};
for (const k of QUIZ.kurser) {
  for (const t of k.tekster) TEXT[k.kode + "/" + t.id] = t;
  for (const q of k.spørgsmål) ALL.push(Object.assign({kursus: k.kode}, q));
}
const textOf = q => TEXT[q.kursus + "/" + q.kilde] || {label: q.kilde};

// ---------- home ----------
function home(){
  const fejl = ALL.filter(q => S.fejl.includes(q.id));
  const seg = $("div", {class:"seg"},
    ["10","Alle"].map(v => $("button", {class: S.antal===v ? "on" : "", onclick(){ S.antal=v; save(S); home(); }}, v === "10" ? "10 tilfældige" : "Alle spørgsmål")));
  const fokus = $("div", {class:"seg"},
    [["alt","Alt"],["argument","Hovedargumenter"],["begreber","Begreber & teori"]].map(([v,l]) =>
      $("button", {class: S.fokus===v ? "on" : "", onclick(){ S.fokus=v; save(S); home(); }}, l)));
  const tog = $("label", {class:"tog"},
    $("input", {type:"checkbox", checked: S.aabne, onchange(e){ S.aabne = e.target.checked; save(S); home(); }}),
    "Åbne spørgsmål med (vis svar & vurdér selv)");

  const courses = QUIZ.kurser.map(k => {
    const qs = ALL.filter(q => q.kursus === k.kode);
    const mc = qs.filter(q => q.type === "mc").length, open = qs.length - mc;
    const arg = qs.filter(q => q.kategori === "argument").length;
    const best = S.bedst[k.kode];
    return $("div", {class:"card"},
      $("div", {class:"row spread"},
        $("div", {}, $("h2", {}, k.kode), $("div", {class:"sub"}, k.navn)),
        best != null ? $("span", {class:"chip acc"}, "Bedst " + best + "%") : null),
      $("div", {class:"texts"}, k.tekster.map(t =>
        $("div", {}, $("span", {}, "• " + t.label), t.læst === false ? $("span", {class:"chip unread"}, "ulæst") : null))),
      $("div", {class:"sub", style:"margin-bottom:10px"}, mc + " multiple choice · " + open + " åbne · " + arg + " om hovedargumenter"),
      $("button", {class:"btn", onclick(){ start(qs, k.kode); }}, "Start " + k.kode));
  });

  screen(
    $("h1", {}, QUIZ.titel),
    $("div", {class:"sub"}, QUIZ.undertitel || ""),
    $("div", {class:"card"}, fokus, $("div", {style:"height:10px"}), seg, $("div", {style:"height:12px"}), tog),
    courses,
    $("div", {class:"card"},
      $("button", {class:"btn ghost", onclick(){ start(ALL, "alle"); }}, "Alle kurser blandet"),
      fejl.length ? $("div", {style:"height:10px"}) : null,
      fejl.length ? $("button", {class:"btn ghost", onclick(){ start(fejl, "fejl", true); }}, "Øv mine fejl (" + fejl.length + ")") : null),
    $("div", {style:"text-align:center"}, $("button", {class:"link", onclick(){ if (confirm("Nulstil fejl og bedste resultater?")) { S.fejl=[]; S.bedst={}; save(S); home(); } }}, "Nulstil fremskridt"))
  );
  setFoot();
}

// ---------- quiz ----------
let R;
function start(pool, scope, keepAll){
  let qs = pool.filter(q => S.aabne || q.type === "mc" || scope === "fejl");
  if (scope !== "fejl") qs = qs.filter(FOKUS[S.fokus] || FOKUS.alt);
  qs = shuffle(qs);
  if (!keepAll && S.antal === "10") {
    // Always include one main-argument question per text, then fill up at random.
    const seen = new Set(), first = [];
    for (const q of qs) {
      const key = q.kursus + "/" + q.kilde;
      if (q.kategori === "argument" && !seen.has(key)) { seen.add(key); first.push(q); }
    }
    qs = shuffle(first.slice(0, 10).concat(qs.filter(q => !first.includes(q))).slice(0, 10));
  }
  if (!qs.length) return;
  R = {qs, i:0, log:[], scope};
  ask();
}

function header(){
  const q = R.qs[R.i], t = textOf(q);
  return [
    $("div", {class:"qhead"},
      $("div", {class:"row"},
        $("span", {class:"chip acc"}, q.kursus),
        q.kategori ? $("span", {class: "chip" + (q.kategori === "argument" ? " arg" : "")}, KAT[q.kategori] || q.kategori) : null,
        $("span", {class:"chip"}, t.label + (q.side ? " · " + q.side : "")),
        t.læst === false ? $("span", {class:"chip unread"}, "ulæst") : null),
      $("button", {class:"x", "aria-label":"Afslut", onclick(){ R.log.length ? finish() : home(); }}, "×")),
    $("div", {class:"bar"}, $("i", {style:"width:" + (R.i / R.qs.length * 100) + "%"})),
    $("div", {class:"sub"}, "Spørgsmål " + (R.i+1) + " af " + R.qs.length),
  ];
}

function record(q, ok, chosen){
  R.log.push({q, ok, chosen});
  const set = new Set(S.fejl);
  ok ? set.delete(q.id) : set.add(q.id);
  S.fejl = [...set]; save(S);
}

function next(){ R.i++; R.i < R.qs.length ? ask() : finish(); }

function ask(){
  const q = R.qs[R.i];
  if (q.type === "åben") return askOpen(q);
  const order = shuffle(q.muligheder.map((_, i) => i));
  let answered = false;
  const btns = order.map((oi, n) => $("button", {class:"opt", "data-k": "ABCD"[n] || n+1, onclick(){ choose(oi); }}, q.muligheder[oi]));
  const expl = $("div");
  function choose(oi){
    if (answered) return; answered = true;
    const ok = oi === q.rigtig;
    btns.forEach((b, n) => {
      const idx = order[n];
      if (idx === q.rigtig) b.classList.add("ok");
      else if (idx === oi) b.classList.add("bad");
      else b.classList.add("dim");
    });
    expl.replaceChildren($("div", {class:"expl"}, $("b", {}, ok ? "Rigtigt. " : "Forkert. "), q.forklaring || ""));
    record(q, ok, q.muligheder[oi]);
    setFoot($("button", {class:"btn", onclick: next}, R.i+1 < R.qs.length ? "Næste" : "Se resultat"));
    expl.scrollIntoView({behavior:"smooth", block:"nearest"});
  }
  R.key = e => {
    const n = "1234abcd".indexOf(e.key.toLowerCase()) % 4;
    if (!answered && n >= 0 && n < btns.length) choose(order[n]);
    else if (answered && e.key === "Enter") next();
  };
  screen(...header(), $("div", {class:"q"}, q.tekst), ...btns, expl);
  setFoot();
}

function askOpen(q){
  const box = $("div");
  function reveal(){
    box.replaceChildren($("div", {class:"expl answer"}, $("b", {}, "Modelsvar: "), q.svar));
    setFoot(
      $("button", {class:"btn ghost", onclick(){ record(q, false, "(ikke helt)"); next(); }}, "Ikke helt"),
      $("button", {class:"btn", onclick(){ record(q, true, ""); next(); }}, "Kunne det"));
  }
  R.key = e => { if (e.key === "Enter" || e.key === " ") reveal(); };
  screen(...header(),
    $("div", {class:"q"}, q.tekst),
    $("div", {class:"sub"}, "Tænk (eller skriv) dit svar, og sammenlign så med modelsvaret."),
    box);
  setFoot($("button", {class:"btn", onclick: reveal}, "Vis svar"));
}

function finish(){
  R.key = null;
  const n = R.log.length, ok = R.log.filter(l => l.ok).length;
  const pct = n ? Math.round(ok / n * 100) : 0;
  if (R.scope !== "fejl") { S.bedst[R.scope] = Math.max(S.bedst[R.scope] || 0, pct); save(S); }

  const byText = {};
  for (const l of R.log) {
    const t = textOf(l.q), k = l.q.kursus + " · " + t.label;
    byText[k] = byText[k] || {ok:0, n:0}; byText[k].n++; if (l.ok) byText[k].ok++;
  }
  const rows = Object.entries(byText).sort((a,b) => a[1].ok/a[1].n - b[1].ok/b[1].n)
    .map(([k,v]) => $("div", {class:"row spread", style:"padding:4px 0;flex-wrap:nowrap"}, $("span", {class:"grow"}, k), $("span", {class:"chip"}, v.ok + "/" + v.n)));
  const byKat = {};
  for (const l of R.log) { const k = KAT[l.q.kategori] || "Andet"; byKat[k] = byKat[k] || {ok:0, n:0}; byKat[k].n++; if (l.ok) byKat[k].ok++; }
  const katRows = Object.entries(byKat).map(([k,v]) => $("div", {class:"row spread", style:"padding:4px 0"}, $("span", {}, k), $("span", {class:"chip"}, v.ok + "/" + v.n)));
  const missed = R.log.filter(l => !l.ok);

  screen(
    $("h1", {}, "Resultat"),
    $("div", {class:"card", style:"text-align:center"},
      $("div", {class:"big"}, pct + "%"),
      $("div", {class:"sub"}, ok + " af " + n + " rigtige")),
    $("div", {class:"card"}, $("h2", {style:"margin-bottom:8px"}, "Per tekst"), rows),
    $("div", {class:"card"}, $("h2", {style:"margin-bottom:8px"}, "Per kategori"), katRows),
    missed.length ? $("div", {class:"card"}, $("h2", {style:"margin-bottom:4px"}, "Gennemgå fejl"),
      missed.map(l => $("div", {class:"miss"},
        $("div", {style:"font-weight:600"}, l.q.tekst),
        l.q.type === "mc" ? $("div", {class:"your"}, "Dit svar: " + l.chosen) : null,
        $("div", {class:"right"}, l.q.type === "mc" ? "Rigtigt: " + l.q.muligheder[l.q.rigtig] : "Se modelsvaret igen under ‘Øv mine fejl’")))) : null
  );
  setFoot(
    $("button", {class:"btn ghost", onclick: home}, "Forside"),
    missed.length ? $("button", {class:"btn", onclick(){ start(missed.map(l => l.q), "fejl", true); }}, "Tag fejlene igen") : null);
}

document.addEventListener("keydown", e => { if (R && R.key && !e.metaKey && !e.ctrlKey) R.key(e); });
home();
</script>
